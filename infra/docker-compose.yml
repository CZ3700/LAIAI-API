# LAIAI-NEXT 全栈一键部署
# 用法：cp .env.example .env && 填密钥 && docker compose up -d --build
# 纪律：无 ${VAR:-tag} 镜像 fallback 漂移（旧平台隐式回滚事故）；版本升级显式改本文件
services:
  mysql:
    image: mysql:8.4
    container_name: laiai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: laiai
      MYSQL_USER: laiai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/laiai.cnf:ro
    healthcheck:
      # P2-6：口令走 MYSQL_PWD 环境变量，不上命令行（否则 docker inspect / ps 可见）
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [laiai]

  redis:
    image: redis:7-alpine
    container_name: laiai-redis
    restart: unless-stopped
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?set in .env}"]
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      # P2-6：口令走 REDISCLI_AUTH 环境变量，不上命令行（避免 -a 明文暴露 + redis 告警）
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [laiai]

  core:
    # WS-3 多实例：无 container_name → 可 `docker compose up -d --scale core=N` 起多副本。
    # Caddy 用 dynamic DNS（服务名 core）轮询所有副本；后台 job 用 Redis leader 租约只在一个副本跑；
    # 迁移用 MySQL GET_LOCK 串行化（N 个副本启动只一个真正迁移）。多实例务必配 LAIAI_REDIS_ADDR
    # （已默认 redis:6379），否则限流/缓存失效退化为各副本独立（运维红线）。
    build:
      context: ..
      dockerfile: infra/core.Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    environment:
      LAIAI_DSN: "laiai:${MYSQL_PASSWORD}@tcp(mysql:3306)/laiai?parseTime=true&charset=utf8mb4&loc=UTC"
      LAIAI_AUTH_SECRET: ${LAIAI_AUTH_SECRET:?set in .env (>=32 chars)}
      LAIAI_ADMIN_TOKEN: ${LAIAI_ADMIN_TOKEN:-}
      LAIAI_DATA_KEYS: ${LAIAI_DATA_KEYS:-}
      LAIAI_DATA_KEY_ACTIVE: ${LAIAI_DATA_KEY_ACTIVE:-}
      LAIAI_INVOCATION_RETENTION_DAYS: ${LAIAI_INVOCATION_RETENTION_DAYS:-30}
      LAIAI_TRUSTED_PROXIES: ${LAIAI_TRUSTED_PROXIES:-} # 可信反代（P1-2）；空=私网段默认（本 compose 拓扑即用）
      LAIAI_REDIS_ADDR: "redis:6379"
      LAIAI_REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env} # 跨实例限流连 redis（requirepass）
      LAIAI_LISTEN_ADDR: ":8080"
    read_only: true
    tmpfs:
      - /tmp:size=10M
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks: [laiai]

  caddy:
    build:
      context: ..
      dockerfile: infra/caddy.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: laiai-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro # 配置可挂载；前端产物在镜像内（绝不 bind mount）
      - caddy-data:/data
      - caddy-config:/config
    environment:
      LAIAI_DOMAIN: ${LAIAI_DOMAIN:-:80}
    depends_on:
      - core
    networks: [laiai]

volumes:
  mysql-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  laiai:
    driver: bridge
