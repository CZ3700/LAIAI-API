# LAIAI-NEXT Redis 加固（移植旧平台：危险命令禁用 + AOF 持久化）
# 密码经 compose 命令行 --requirepass 注入
protected-mode yes
maxmemory 256mb
maxmemory-policy allkeys-lru

appendonly yes
appendfsync everysec

# 危险命令禁用（FLUSHALL 误操作 = 限流/锁/队列全清）
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
