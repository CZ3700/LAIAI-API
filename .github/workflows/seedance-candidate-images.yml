# Candidate artifacts only: no production connection, migration or deployment.
name: Seedance candidate images

on:
  pull_request:
    branches: [codex/seedance-release-readiness]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seedance-candidate-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'CZ3700/LAIAI-API' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'codex/seedance-release-artifacts' &&
        github.event.pull_request.base.ref == 'codex/seedance-release-readiness') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/codex/seedance-release-artifacts' || github.ref == 'refs/heads/main')))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Select the exact source commit
        id: source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  gates:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}

  publish:
    needs: [source, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Check out the commit that passed every gate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Verify source and build timestamp input
        id: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          printf 'epoch=%s\n' "$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Resolve all application base images before either build
        id: bases
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seedance-candidate"
          printf '{}\n' > "$RUNNER_TEMP/seedance-candidate/base-images.json"
          while IFS='=' read -r key tag; do
            metadata=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}')
            digest=$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("expected one linux/amd64 base manifest") end' <<< "$metadata")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            pinned="${tag%@*}@$digest"
            printf '%s=%s\n' "$key" "$pinned" >> "$GITHUB_OUTPUT"
            jq --arg key "$key" --arg tag "$tag" --arg pinned "$pinned" \
              '. + {($key): {source_tag: $tag, reference: $pinned, platform: "linux/amd64"}}' \
              "$RUNNER_TEMP/seedance-candidate/base-images.json" > "$RUNNER_TEMP/seedance-candidate/base-images.next.json"
            mv "$RUNNER_TEMP/seedance-candidate/base-images.next.json" "$RUNNER_TEMP/seedance-candidate/base-images.json"
          done <<'BASES'
          GO_IMAGE=docker.io/library/golang:1.26-alpine
          ALPINE_IMAGE=docker.io/library/alpine:3.21
          NODE_IMAGE=docker.io/library/node:22-alpine
          CADDY_IMAGE=docker.io/library/caddy:2-alpine
          BASES
      - name: Log in to the repository's GHCR packages
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish core
        id: core
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/core.Dockerfile
          platforms: linux/amd64
          push: true
          github-token: ''
          tags: ghcr.io/cz3700/laiai-api-core:sha-${{ needs.source.outputs.sha }}
          build-args: |
            GO_IMAGE=${{ steps.bases.outputs.GO_IMAGE }}
            ALPINE_IMAGE=${{ steps.bases.outputs.ALPINE_IMAGE }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          labels: |
            org.opencontainers.image.source=https://github.com/CZ3700/LAIAI-API
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
      - name: Build and publish Caddy with the matching Web
        id: caddy
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/caddy.Dockerfile
          platforms: linux/amd64
          push: true
          github-token: ''
          tags: ghcr.io/cz3700/laiai-api-caddy:sha-${{ needs.source.outputs.sha }}
          build-args: |
            NODE_IMAGE=${{ steps.bases.outputs.NODE_IMAGE }}
            CADDY_IMAGE=${{ steps.bases.outputs.CADDY_IMAGE }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          labels: |
            org.opencontainers.image.source=https://github.com/CZ3700/LAIAI-API
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
      - name: Verify the published pair and write the candidate manifest
        env:
          CORE_DIGEST: ${{ steps.core.outputs.digest }}
          CADDY_DIGEST: ${{ steps.caddy.outputs.digest }}
        run: |
          set -euo pipefail
          for digest in "$CORE_DIGEST" "$CADDY_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          for item in "core=$CORE_DIGEST" "caddy=$CADDY_DIGEST"; do
            service=${item%%=*}
            digest=${item#*=}
            ref="ghcr.io/cz3700/laiai-api-$service@$digest"
            actual=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er '.digest')
            test "$actual" = "$digest"
          done
          jq -n --arg source_commit "$SOURCE_SHA" --arg core_digest "$CORE_DIGEST" \
            --arg caddy_digest "$CADDY_DIGEST" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --slurpfile bases "$RUNNER_TEMP/seedance-candidate/base-images.json" \
            '{schema_version: 1, source_commit: $source_commit, platform: "linux/amd64", workflow_run: $run,
              gates: {source_commit: $source_commit, result: "success", jobs: ["ci", "web", "redline", "ark-mysql"]},
              base_images: $bases[0],
              images: {core: {tag: ("ghcr.io/cz3700/laiai-api-core:sha-" + $source_commit), digest: $core_digest, reference: ("ghcr.io/cz3700/laiai-api-core@" + $core_digest)},
                caddy: {tag: ("ghcr.io/cz3700/laiai-api-caddy:sha-" + $source_commit), digest: $caddy_digest, reference: ("ghcr.io/cz3700/laiai-api-caddy@" + $caddy_digest)}}}' \
            > "$RUNNER_TEMP/seedance-candidate/release-manifest.json"
          printf 'Candidate source: `%s`\n\nCI and both image publications succeeded. Use the paired digest references in the manifest; no deployment was performed.\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the complete candidate manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seedance-candidate-${{ needs.source.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seedance-candidate/*.json
          if-no-files-found: error
          retention-days: 30
