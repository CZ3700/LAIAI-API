# laiai-next CI —— 与本地 make ci 完全一致的远端门禁
# 资金/支付核心仓库：push 到 main 必须全绿；红线机检见 redline job
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/ark-*', 'codex/maas-*', 'codex/model-*', 'codex/seedance-*']

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.work
          cache: true
      - name: Verify installed Go security baseline
        run: |
          sh scripts/tests/test-go-toolchain.sh
          sh scripts/check-go-toolchain.sh
      - name: make ci (vet + migrate-lint + test + build)
        run: make ci
        env:
          GOPROXY: https://proxy.golang.org,direct

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install console dependencies
        run: npm ci --prefix web
      - name: Display currency precision and session regressions
        # Monetary math and account/organization isolation use the production store.
        run: npm run test:money --prefix web
      - name: Playground context isolation regression
        run: npm run test:playground --prefix web
      - name: Public model catalog contracts
        run: npm run test:models --prefix web
      - name: Key video permissions and session isolation
        run: npm run test:keys --prefix web
      - name: Invocation filters, exact snapshots and real Vue context isolation
        run: npm run test:invocation --prefix web
      - name: Console 类型检查 + 构建
        run: make web
      - name: Video pricing context regressions
        run: npm --prefix web run test:video-pricing
      - name: Provider pricing editor regressions
        run: npm --prefix web run test:pricing-editor
      - name: Public API documentation contracts
        run: npm --prefix web run test:api-docs
      - name: Asset management configuration context regressions
        run: npm --prefix web run test:video-assets

  ark-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ark-ci-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: ark_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -park-ci-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      GOPROXY: https://proxy.golang.org,direct
      LAIAI_DSN: root:ark-ci-test-only@tcp(127.0.0.1:3306)/ark_test?parseTime=true
      ARK_TEST_MYSQL_DSN: root:ark-ci-test-only@tcp(127.0.0.1:3306)/ark_test?parseTime=true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.work
          cache: true
      - name: Verify installed Go security baseline
        run: sh scripts/check-go-toolchain.sh
      - name: Seedance template upgrade preserves existing data
        run: go -C core test ./internal/arkpricetemplate -run TestMySQL -count=1 -timeout=5m
      - name: Runtime expand migration and interrupted replay preserve old data
        run: go -C core test ./internal/migrate -run TestMySQLVideoRuntimeMigrationPreservesLegacyAndReplays -count=1 -timeout=5m -v
      - name: Key billing retention, current-read races and index replay
        run: go -C core test -race -p 1 ./internal/identity ./internal/videobilling ./internal/server -run '^(TestPurgeRevokedKey|TestKeySnapshotReference|TestKeyPurge|TestMySQLKeyPurge|TestMySQLKeySnapshotIndex)' -count=2 -timeout=10m -v
      - name: Response inbox expand and partial migration preserve legacy data
        run: go -C core test ./internal/migrate -run TestMySQLVideoInboxMigrationPreservesLegacyAndReplays -count=1 -timeout=5m -v
      - name: Routing groups preserve legacy keys and serialize default grants
        run: go -C core test -race ./internal/migrate -run TestMySQLRouting -count=1 -timeout=8m -v
      - name: Mutation target expand preserves inbox and old writers
        run: go -C core test ./internal/migrate -run TestMySQLVideoActionTargetMigrationPreservesLegacyAndReplays -count=1 -timeout=5m -v
      - name: Apply and replay formal MySQL migrations
        run: |
          go -C core run ./cmd/migrate -dir ../migrations
          go -C core run ./cmd/migrate -dir ../migrations
      - name: Ark MySQL transaction and HTTP integration
        # These packages share fixtures and model configuration in ark_test.
        # Keep package fixtures isolated while retaining in-test concurrency.
        run: go -C core test -p 1 ./internal/video ./internal/videoasset ./internal/server -run 'TestMySQL|TestArkBillMySQL' -count=1 -timeout=10m
      - name: Billing admin and control-plane lifecycle regressions
        run: go -C core test -race ./internal/server -run '^(TestArkBillMySQL|TestAuthRateLimit$|TestRealtime(WriteDeadlineDoS|IdleTimeout)$)' -count=1 -timeout=3m
      - name: Invocation snapshot queries, exact totals and bounded CSV
        # Includes real two-connection snapshot, read-pool cancellation and
        # a private 100K-row schema; never uses deployment credentials.
        run: go -C core test -race -p 1 ./internal/invocation ./internal/server -run '^(TestQuery|TestInvocation|TestMySQLInvocation)' -count=1 -timeout=8m
      - name: Execution input primary-clock TTL, identity and real retention
        # The Blob cleanup test waits the actual 150-second database grace.
        # The separate fixed-binary handoff harness is not selected here.
        run: >-
          go -C core test -race -p 1 ./internal/invocation ./internal/video
          -run '^(TestMySQLVideo(Execution|RetentionAndTTLPurge$|BlobRestartSafeUploadAndPurge$|UploadFenceAndExpiry$)|TestMySQLExecution(Input(IdentityPrecedesLocalRelease|EarlyFailureIdentityAndInbox|FinalSQLUsesDatabaseExpiry|HostClockFailuresRemainUncertain)|ActionExpiredIdentityStillControlsNotSent)$)'
          -count=2 -timeout=15m -v
      - name: Named routing administration and bounded MySQL reads
        run: go -C core test -race -p 1 ./internal/identity ./internal/relay ./internal/routinggroup ./internal/server -run '^(TestRouting|TestGroupCreate|TestGroupInsertDuplicate|TestAdmin(Read|Preview|Select)|TestMySQLRoutingAdmin)' -count=1 -timeout=8m
      - name: Organization routing grants and default CAS
        run: go -C core test -race ./internal/server -run '^(TestMySQLRoutingOrgAdmin|TestRoutingOrgAdmin)' -count=1 -timeout=10m -v
      - name: Bounded routing candidates preserve closed grouped-key gates
        run: go -C core test -race -p 1 ./internal/identity ./internal/relay ./internal/routinggroup ./internal/server -run '^(TestCandidates|TestRoutingCandidate|TestRoutingPublished|TestMySQLRoutingCandidates)' -count=2 -timeout=10m -v
      - name: Official video catalog shared publication and isolated snapshot acceptance
        run: |
          go -C core test -race -p 1 ./internal/identity ./internal/relay ./internal/videobilling ./internal/video ./internal/server -run '^(TestVideoCatalog|TestCatalogPublication|TestPublication)' -count=1 -timeout=10m -v
          go -C core test -race -p 1 ./internal/video ./internal/server -run '^TestMySQLVideoCatalog' -count=2 -timeout=15m -v
      - name: Ark concurrency and Linux storage checks
        run: go -C core test -race ./internal/video ./internal/videoartifact ./internal/videoasset ./internal/videobilling ./internal/invocation ./internal/notify -count=1 -timeout=20m
      - name: Primary database scheduling and lease authority
        run: go -C core test -race ./internal/video -run '^TestMySQLDatabaseAuthority' -count=2 -timeout=25m -v
      - name: Gated mutation producer atomicity and dispatch faults
        run: go -C core test -race ./internal/video -run '^(TestMutationProducer|TestMySQLMutationProducer)' -count=1 -timeout=8m -v
      - name: Raw HTTP task classifications survive persistence and restart
        run: go -C core test -race ./internal/video -run '^TestMySQLRuntimeHTTP(CreatePersistence|QueryAcceptedPersistence|NullableUsagePersistence|UninterpretableQueryPersistence)$' -count=2 -timeout=8m -v
      - name: Main lifecycle HTTP and real mutation SIGTERM drain checks
        # Real mutation tests use their own generated ark_test_mshutdown schemas.
        run: go -C core test -race ./cmd/core -count=1 -timeout=6m -v

  ark-mock-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOPROXY: https://proxy.golang.org,direct
      ARK_BASELINE_MYSQL_IMAGE: docker.io/library/mysql@sha256:c36050afdca850f23cef85703f84c7531a5ae155a11b5ee1c60acb09937c4084
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.work
          cache: true
      - name: Isolated single-scope Mock Ark baseline
        # Creates its own disposable database. No deployment DSN or Ark key.
        env:
          ARK_BASELINE_REPORT_DIR: ${{ runner.temp }}/ark-mock-baseline
        run: make ark-mock-baseline
      - name: Retain baseline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ark-mock-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/ark-mock-baseline
          if-no-files-found: warn
          retention-days: 14

  ark-runtime-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOPROXY: https://proxy.golang.org,direct
      ARK_RUNTIME_MYSQL_IMAGE: docker.io/library/mysql@sha256:c36050afdca850f23cef85703f84c7531a5ae155a11b5ee1c60acb09937c4084
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # Includes the fixed pre-runtime implementation.
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.work
          cache: true
      - name: Real old/new runtime handoff and safe runner failure paths
        env:
          ARK_RUNTIME_REPORT_DIR: ${{ runner.temp }}/ark-runtime-compat
        run: make ark-runtime-compat
      - name: Retain runtime compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ark-runtime-compat-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ark-runtime-compat/run-*/*.json
            ${{ runner.temp }}/ark-runtime-compat/run-*/*.jsonl
            ${{ runner.temp }}/ark-runtime-compat/run-*/*.log
            ${{ runner.temp }}/ark-runtime-compat/run-*/mysql-image-id
          if-no-files-found: warn
          retention-days: 14

  ark-mutation-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOMAXPROCS: 3
      GOMEMLIMIT: 3GiB
      # Deliberately no services/DSN: the runner owns its digest-pinned MySQL.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Verify fixed compiler and Linux prerequisites
        run: |
          test "$(go env GOVERSION)" = go1.26.10
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          docker version --format '{{.Server.Version}}'
          git cat-file -e 64650ecc9e3a672ea49d0ffaf6f417b03fe6ad89^{commit}
          git cat-file -e 24da28583eddfaad151b9a4a054264a8275b61bb^{commit}
      - name: Full mutation handoff, host negative tests and independent validator
        env:
          ARK_MUTATION_REPORT_DIR: ${{ runner.temp }}/ark-mutation-compat-${{ github.run_id }}-${{ github.run_attempt }}
        run: make ark-mutation-compat
      - name: Retain safe mutation compatibility metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ark-mutation-compat-${{ github.sha }}-${{ github.run_attempt }}
          # Never upload the raw parent: it may retain mysql.env after a crash.
          path: ${{ runner.temp }}/ark-mutation-compat-${{ github.run_id }}-${{ github.run_attempt }}/export
          if-no-files-found: warn
          retention-days: 14

  ark-execution-input-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOMAXPROCS: 3
      GOMEMLIMIT: 4GiB
      # The runner creates its own digest-pinned MySQL and loopback Mock.
      # No deployment DSN, official credential or supplied old revision.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.10'
          cache: true
      - name: Verify compiler and fixed previous implementation
        run: |
          test "$(go env GOVERSION)" = go1.26.10
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          docker --host unix:///var/run/docker.sock version --format '{{.Server.Version}}'
          git cat-file -e 9a6fd9426e33b2e1c269b6cb77a170e8890073f2^{commit}
      - name: Execution input handoff, failure controls and raw-evidence verification
        env:
          EXECUTION_INPUT_REPORT_DIR: ${{ runner.temp }}/ark-execution-input-${{ github.run_id }}-${{ github.run_attempt }}
          EXECUTION_INPUT_COMPILER: host
        run: make ark-execution-input-compat
      - name: Retain safe execution input compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ark-execution-input-${{ github.sha }}-${{ github.run_attempt }}
          # Export records original/export hashes and removes synthetic secrets
          # from text. The private parent is deliberately never uploaded.
          path: ${{ runner.temp }}/ark-execution-input-${{ github.run_id }}-${{ github.run_attempt }}/export
          if-no-files-found: warn
          retention-days: 14

  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Production release syntax and isolated failure-path tests
        run: sudo make release-check
      - name: Private checkout image permissions and real MySQL migration
        run: bash infra/release/tests/test_image_permissions.sh

  redline:
    # CLAUDE.md 平台红线中可机检项
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 禁止 GORM AutoMigrate（红线 5）
        run: |
          # 只匹配实际调用 .AutoMigrate(，不误伤注释里"禁用 AutoMigrate"的字面提及（如 migrate.go 的红线说明）
          if grep -rnE '\.AutoMigrate\(' core/ relay/ --include="*.go"; then
            echo "::error::检测到 AutoMigrate 调用 —— 违反红线 5，schema 只走 migrations/NNNN_*.sql"
            exit 1
          fi
      - name: 金额禁止 float（工程约定）
        run: |
          if grep -rnE "(amount|balance|price|fee)[A-Za-z]*\s+(float32|float64)" core/ relay/ --include="*.go" | grep -v _test.go; then
            echo "::error::金额字段疑似使用 float —— 一律 shopspring/decimal"
            exit 1
          fi
      - name: 迁移文件命名顺序递增
        run: |
          ls migrations/ | grep -E '^[0-9]{4}_.*\.sql$' | sort -c || {
            echo "::error::migrations/ 命名不符合 NNNN_*.sql 顺序"; exit 1; }
      - name: 禁止 ledger 包外写 ledger_accounts（红线 1）
        run: |
          if grep -rnE 'UPDATE\s+ledger_accounts|Table\("ledger_accounts"\)' core/ relay/ --include="*.go" | grep -v "core/internal/ledger/" | grep -v "_test.go"; then
            echo "::error::检测到 ledger 包外写 ledger_accounts —— 全库唯一写余额位置是 ledger.applyBalanceDelta（红线 1）"
            exit 1
          fi
      - name: 数据面禁止裸 http.DefaultClient（超时/SSRF 纪律）
        run: |
          if grep -rn 'http\.DefaultClient' core/internal/relay/ core/internal/task/ --include="*.go" | grep -v "_test.go" | grep -v '//.*http\.DefaultClient'; then
            echo "::error::数据面出现裸 http.DefaultClient —— 上游请求必须走带超时的框架 client / GuardedClient"
            exit 1
          fi
