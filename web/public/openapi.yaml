    "/v1/video/generations/{task_id}/content": {
      "get": {
        "description": "经过平台鉴权及组织归属校验后返回链接 JSON，不再返回媒体流或重定向。\n优先使用任务详情的 content.video_url / content.last_frame_url。\n客户自行访问 url，不向外站发送 Gateway Bearer。签名参数须原样保留，有效期由上游决定。\n无额外生成收费；链接未取得返回 409，链接结果已失效返回 410，官方查询失败可能返回 503。\nkind=last_frame 仅请求过 return_last_frame 且官方返回尾帧时可用。链接失败不应重新创建任务。\n",
        "operationId": "getVideoContent",
        "parameters": [
          {
            "in": "query",
            "name": "kind",
            "schema": {
              "default": "video",
              "enum": [
                "video",
                "last_frame"
              ],
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "additionalProperties": false,
                  "properties": {
                    "kind": {
                      "enum": [
                        "video",
                        "last_frame"
                      ],
                      "type": "string"
                    },
                    "source": {
                      "const": "upstream",
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "pattern": "^https://",
                      "type": "string"
                    }
                  },
                  "required": [
                    "url",
                    "kind",
                    "source"
                  ],
                  "type": "object"
                }
              }
            },
            "description": "官方产物链接；平台不持久化媒体文件。",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "const": "private, no-store",
                  "type": "string"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        },
        "summary": "获取成功任务的视频或尾帧直链",
        "tags": [
          "Tasks"
        ]
      },
      "parameters": [
        {
          "$ref": "#/components/parameters/TaskId"
        }
      ]
    },
    "/v1/video/generations/{task_id}/events": {
      "get": {
        "description": "只提供事件类型、状态变化、平台 request_id 和时间；\n不包含 prompt、素材 URL、H5 授权 URL、上游原文、原始上游 ID、供应商成本或内部路由。\n任务软删除不抹除安全事件。列表仅来自本组织平台数据库。\n",
        "operationId": "listVideoTaskEvents",
        "parameters": [
          {
            "$ref": "#/components/parameters/Limit"
          },
          {
            "$ref": "#/components/parameters/Cursor"
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "additionalProperties": false,
                  "properties": {
                    "data": {
                      "items": {
                        "$ref": "#/components/schemas/TaskEvent"
                      },
                      "type": "array"
                    },
                    "next_cursor": {
                      "type": [
                        "string",
                        "null"
                      ]
                    }
                  },
                  "required": [
                    "data",
                    "next_cursor"
                  ],
                  "type": "object"
                }
              }
            },
            "description": "安全事件分页"
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        },
        "summary": "查询任务安全事件",
        "tags": [
          "Tasks"
        ]
      },
      "parameters": [
        {
          "$ref": "#/components/parameters/TaskId"
        }
      ]
    },
    "/v1/video/models": {
      "get": {
        "description": "返回平台配置与 Key 模型白名单的交集，可为空。enabled/verified 是必要条件，创建仍检查实时价格、预算、渠道和租户策略。价格是客户售价，不包含上游成本。",
        "operationId": "listVideoModels",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "additionalProperties": false,
                  "properties": {
                    "data": {
                      "items": {
                        "$ref": "#/components/schemas/ModelInfo"
                      },
                      "type": "array"
                    }
                  },
                  "required": [
                    "data"
                  ],
                  "type": "object"
                }
              }
            },
            "description": "模型能力与公开价格"
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        },
        "summary": "查询当前组织可见的视频模型及能力版本",
        "tags": [
          "Models"
        ]
      }
    },
    "/v1/video/operations/{operation_id}": {
      "get": {
        "description": "独立持久化操作资源，当前查询任务取消、任务删除和虚拟空素材组删除，强制组织隔离。\npending/in_flight/sending/unknown 均非成功；只有 confirmed 表示有充分证据确认该操作完成。\nrejected 表示操作被拒绝。任务操作不返回 error/completed_at；素材组操作可提供安全 error 和完成时间。\n创建任务/素材/会话请查询各自资源，不通过此接口枚举内部创建操作。原资源已删除后仍可查询删除操作。\n本接口或原资源 GET 返回 404 均不代表操作成功，不得据此退款或删除本地账务证据。\n",
        "operationId": "getVideoOperation",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Operation"
                }
              }
            },
            "description": "持久化操作状态"
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        },
        "summary": "查询取消或删除操作",
        "tags": [
          "Tasks"
        ]
      },
      "parameters": [
        {
          "in": "path",
          "name": "operation_id",
          "required": true,
          "schema": {
            "pattern": "^op_[A-Za-z0-9_-]+$",
            "type": "string"
          }
        }
      ]
    },
    "/v1/video/portrait-authorizations": {
      "get": {
        "description": "仅读平台库；列表不返回 authorization_url。授权会话不提供客户端写状态或伪造授权接口。",
        "operationId": "listPortraitAuthorizations",
        "parameters": [
          {
            "$ref": "#/components/parameters/Limit"
          },
          {
            "$ref": "#/components/parameters/Cursor"
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "additionalProperties": false,
                  "properties": {
                    "data": {
                      "items": {
                        "$ref": "#/components/schemas/PortraitAuthorizationSummary"
                      },
                      "type": "array"
                    },
                    "next_cursor": {
                      "type": [
                        "string",
                        "null"
                      ]
                    }
                  },
                  "required": [
                    "data",
                    "next_cursor"
                  ],
                  "type": "object"
                }
              }
            },
            "description": "授权会话摘要分页"
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        },
        "summary": "列出当前组织的授权会话摘要",
        "tags": [
          "PortraitAuthorization"
        ]
      },
      "post": {
        "description": "异步调用官方 CreateVisualValidateSession 建立流程，creating 阶段尚无 H5 地址；\n创建结果不确定时为 submission_unknown，不允许盲重发官方创建请求。\npending 时才返回 H5 地址，用户在该页面完成授权；\n平台通过 GetVisualValidateResult 核实结果，再把官方返回的组映射为本组织 ag_ ID。\ncallback_url 仅可为预登记 HTTPS 回跳地址，不是可信的授权结果通知来源；\nH5 回跳本身、客户端参数或截图均不能将授权状态改为成功。\n需要已启用的租户素材路由/Portrait 能力、平台固定回调入口及有效回跳登记。H5 成功仅确认身份流程；\n真人素材仍需独立审核且未过期/撤销的 video_generation 业务许可，才能上传或参与任务。\nauthorization_url 属敏感短期 URL，仅在授权会话响应返回，禁止写入普通日志。\n",
        "operationId": "createPortraitAuthorization",
        "parameters": [
          {
            "$ref": "#/components/parameters/AssetIdempotencyKey"
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "additionalProperties": false,
                "properties": {
                  "callback_url": {
                    "description": "必须精确匹配组织预登记的 HTTPS 回跳地址。",
                    "format": "uri",
                    "maxLength": 2048,
                    "pattern": "^https://",
                    "type": "string"
                  },
                  "description": {
                    "description": "可选会话说明。",
                    "maxLength": 300,
                    "type": "string"
                  },
                  "name": {
                    "description": "可选会话名称。",
                    "maxLength": 64,
                    "type": "string"
                  }
                },
                "required": [
                  "callback_url"
                ],
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "202": {
            "content": {
              "application/json": {
                "example": {
                  "ResponseMetadata": {
                    "Action": "CreateVisualValidateSession",
                    "Region": "cn-beijing",
                    "RequestId": "req_example009",
                    "Service": "ark",
                    "Version": "2024-01-01"
                  },
                  "Result": {
                    "SessionId": "pas_example001",
                    "Status": "creating"
                  }
                },
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/RpcEnvelope"
                    },
                    {
                      "properties": {
                        "Result": {
                          "$ref": "#/components/schemas/RpcCreatePortraitResult"
                        }
                      },
                      "type": "object"
                    }
                  ]
                }
              }
            },
            "description": "会话创建已持久化受理；火山 RPC 官方信封，Action=CreateVisualValidateSession。\ncreating/submission_unknown 尚未获得可用 H5 地址，pending 等待本人完成授权。\n",
            "headers": {
              "Idempotency-Replayed": {
                "$ref": "#/components/headers/IdempotencyReplayed"
              }
            }
          },
          "400": {
            "description": "请求非法。缺 Idempotency-Key 头时 message 明确点名该头；\ncallback_url 与组织预登记回跳地址不匹配时 message 明确要求先完成登记。\n"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "503": {
            "description": "provider_unavailable（retryable）——平台侧真人认证固定回调入口尚未配置，\n属于服务端状态而非请求错误；配置完成后重试即可，请求本身无需修改。\n"
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        },
        "summary": "创建真人 H5 授权会话",
        "tags": [
          "PortraitAuthorization"
        ]
      }
    },
    "/v1/video/portrait-authorizations/{session_id}": {
      "get": {
        "description": "火山 RPC 官方信封，Action=GetVisualValidateResult；CreatedAt 为 Unix 秒。\n状态只由平台核实官方结果后更新；succeeded 时 Result 附 GroupId（本组织 ag_ 映射）。\npending 会话仅创建该会话的原 Key 可经审计读取有效 H5URL，其他 Key 返回 403。\n同一原 Key 在有效 pending 状态可再次 GET；官方认证凭证仍限一次认证。已失效或完成后不返回 H5URL。\nH5URL 属敏感短期 URL，禁止写入普通日志。\n未核实官方撤销/删除会话能力前不开放 DELETE；素材组删除也不等于撤销本人授权。\n",
        "operationId": "getPortraitAuthorization",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "example": {
                  "ResponseMetadata": {
                    "Action": "GetVisualValidateResult",
                    "Region": "cn-beijing",
                    "RequestId": "req_example010",
                    "Service": "ark",
                    "Version": "2024-01-01"
                  },
                  "Result": {
                    "CreatedAt": 1792713600,
                    "H5URL": "https://visual.example.invalid/session?token=...",
                    "SessionId": "pas_example001",
                    "Status": "pending"
                  }
                },
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/RpcEnvelope"
                    },
                    {
                      "properties": {
                        "Result": {
                          "$ref": "#/components/schemas/RpcGetPortraitResult"
                        }
                      },
                      "type": "object"
                    }
                  ]
                }
              }
            },
            "description": "官方信封的授权会话及已核实结果"
          },
          "default": {
            "$ref": "#/components/responses/Error"
          }
        },
        "summary": "查询真人授权会话（官方 GetVisualValidateResult 信封）",
        "tags": [
          "PortraitAuthorization"
        ]
      },
      "parameters": [
        {
          "in": "path",
          "name": "session_id",
          "required": true,
          "schema": {
            "$ref": "#/components/schemas/SessionId"
          }
        }
      ]
    },
    "/v1/video/portrait-callback": {
      "get": {
        "description": "只接受平台签发、绑定组织/会话/回跳登记且未消费的短期 state；不使用 Gateway Key。\n不信任 resultCode、GroupId 或任意 redirect 参数，不据此授予身份认证成功或业务许可。\n消费有效 state 后仅 303 到预登记 HTTPS 地址。客户业务代码应查询 portrait-authorizations 状态。\n",
        "operationId": "consumePortraitBrowserCallback",
        "parameters": [
          {
            "description": "平台与官方 H5 流程传递的敏感短期 opaque state；不得日志记录或自行生成。",
            "in": "query",
            "name": "state",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "303": {
            "description": "已消费 state，跳转至预登记回跳地址。",
            "headers": {
              "Location": {
                "schema": {
                  "format": "uri",
                  "type": "string"
                }
              },
              "Referrer-Policy": {
                "schema": {
                  "const": "no-referrer",
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "description": "state/会话/回跳目标无效、过期或已消费；无响应体。"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        },
        "security": [],
        "summary": "官方 H5 浏览器回跳入口（不供客户主动构造调用）",
        "tags": [
          "PortraitAuthorization"
        ]
      }
    }
  },
