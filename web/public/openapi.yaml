{
  "components": {
    "headers": {
      "IdempotencyReplayed": {
        "description": "true 表示幂等重放已有结果，没有重复创建或冻结。",
        "schema": {
          "type": "boolean"
        }
      }
    },
    "parameters": {
      "AssetId": {
        "in": "path",
        "name": "asset_id",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/AssetId"
        }
      },
      "AssetIdempotencyKey": {
        "description": "素材组、素材、H5 会话创建的幂等键；1–128 字符且不得含控制字符。同组织同路径同键同请求重放，内容冲突为 409 invalid_state。建议统一使用至少 8 位随机业务键。",
        "in": "header",
        "name": "Idempotency-Key",
        "required": true,
        "schema": {
          "maxLength": 128,
          "minLength": 1,
          "type": "string"
        }
      },
      "Cursor": {
        "description": "平台签发的不透明游标，绑定组织和列表过滤条件；任务/事件最长 512 字符，素材/会话最长 1024 字符。原样使用，不跨列表复用。",
        "in": "query",
        "name": "cursor",
        "schema": {
          "maxLength": 1024,
          "type": "string"
        }
      },
      "GroupId": {
        "in": "path",
        "name": "group_id",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/GroupId"
        }
      },
      "IdempotencyKey": {
        "description": "8–128 字符，由调用方为一次业务操作生成。唯一范围是组织、方法、包含资源 ID 的规范化路径、\n幂等键哈希；与 Gateway Key ID 无关。同请求重放同一任务/操作，不同请求 409。\n幂等键及规范化请求分别使用服务端 HMAC-SHA256 和不同的域标签，不保存明文摘要密钥；\n服务端 HMAC 密钥轮换需显式迁移；现有任务幂等版本不允许原位换密钥后静默再次创建。\n不得将同一个键用于不同业务请求。\n",
        "in": "header",
        "name": "Idempotency-Key",
        "required": true,
        "schema": {
          "maxLength": 128,
          "minLength": 8,
          "pattern": "^[!-~]+$",
          "type": "string"
        }
      },
      "Limit": {
        "in": "query",
        "name": "limit",
        "schema": {
          "default": 20,
          "maximum": 100,
          "minimum": 1,
          "type": "integer"
        }
      },
      "TaskId": {
        "in": "path",
        "name": "task_id",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/TaskId"
        }
      }
    },
    "requestBodies": {
      "TaskCreate": {
        "content": {
          "application/json": {
            "example": {
              "content": [
                {
                  "text": "一只纸质小船漂过平静湖面，柔和晨光。",
                  "type": "text"
                }
              ],
              "duration": 5,
              "generate_audio": false,
              "model": "seedance-2.0",
              "ratio": "16:9",
              "resolution": "720p"
            },
            "schema": {
              "$ref": "#/components/schemas/CreateTaskRequest"
            }
          }
        },
        "required": true
      }
    },
    "responses": {
      "Conflict": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        },
        "description": "幂等键复用到不同请求，或任务/素材/授权/账务状态不允许当前操作。"
      },
      "Error": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        },
        "description": "安全错误。素材接口非法 JSON/缺少幂等键/非法网址为 400；任务参数或幂等键非法通常为 422；\n401=Key 无效；403=权限或真人业务许可不足；\n任务接口的素材校验错误映射为 403 forbidden、409 invalid_state 或 422 unsupported_capability；\n素材接口独立返回 authorization_required、resource_in_use、group_not_empty 等安全错误码。\n404=资源不存在或跨组织；409=幂等冲突/状态冲突；410=产物已过期；\n413=请求体超限；422=未验证或不支持的模型参数/素材组合；429=Token 配额/限流/并发限制；\n402=余额不足；500=素材服务内部失败；502/503=服务不可用（503 亦含平台侧\n真人认证回调未配置的 provider_unavailable，属可重试的服务端状态）。已接受的提交结果未知通过任务状态表达，\n不使用误导性的失败结果允许客户任意重新创建。错误 message 不包含上游原文、凭证或 PII。\n",
        "headers": {
          "X-Request-Id": {
            "description": "平台请求 ID",
            "schema": {
              "type": "string"
            }
          }
        }
      },
      "OperationAccepted": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Operation"
            }
          }
        },
        "description": "操作已持久化受理，非完成确认；按 poll_url 查询统一 operations 资源，不根据原资源 404 判断成功。",
        "headers": {
          "Idempotency-Replayed": {
            "$ref": "#/components/headers/IdempotencyReplayed"
          }
        }
      },
      "PaymentRequired": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "Insufficient balance or key quota exhausted"
      },
      "RateLimited": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        },
        "description": "Rate limit exceeded (see Retry-After header)"
      }
    },
    "schemas": {
      "ActualUsage": {
        "additionalProperties": false,
        "description": "官方实际返回的用量；字段缺失为 null，不以零或估算代填。不能假设 total_tokens 永远等于 completion_tokens。",
        "properties": {
          "completion_tokens": {
            "minimum": 0,
            "type": [
              "integer",
              "null"
            ]
          },
          "total_tokens": {
            "minimum": 0,
            "type": [
              "integer",
              "null"
            ]
          }
        },
        "required": [
          "completion_tokens",
          "total_tokens"
        ],
        "type": "object"
      },
      "AssetId": {
        "description": "平台素材 ID。",
        "pattern": "^asset_[A-Za-z0-9_-]+$",
        "type": "string"
      },
      "AudioContent": {
        "additionalProperties": false,
        "properties": {
          "audio_url": {
            "$ref": "#/components/schemas/MediaReference"
          },
          "role": {
            "enum": [
              "",
              "reference_audio"
            ],
            "type": "string"
          },
          "type": {
            "const": "audio_url",
            "type": "string"
          }
        },
        "required": [
          "type",
          "audio_url"
        ],
        "type": "object"
      },
      "Billing": {
        "additionalProperties": false,
        "properties": {
          "actual_usage": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/ActualUsage"
              },
              {
                "type": "null"
              }
            ]
          },
          "billable_tokens": {
            "description": "已确认的客户计费用量；未知为 null，最低计费量和官方 usage 的区别由规则版本定义。",
            "minimum": 0,
            "type": [
              "integer",
              "null"
            ]
          },
          "billing_rule_version": {
            "type": "string"
          },
          "currency": {
            "const": "USD",
            "type": "string"
          },
          "entries": {
            "description": "已持久化客户账务分录；不暴露供应商成本和内部科目。",
            "items": {
              "additionalProperties": false,
              "properties": {
                "amount": {
                  "$ref": "#/components/schemas/MoneyAmount"
                },
                "created_at": {
                  "format": "date-time",
                  "type": "string"
                },
                "currency": {
                  "const": "USD",
                  "type": "string"
                },
                "entry_id": {
                  "pattern": "^be_[A-Za-z0-9_-]+$",
                  "type": "string"
                },
                "type": {
                  "description": "amount 总为非负；adjustment_credit 减少净费用，adjustment_debit 增加净费用。释放未消费冻结额与退回已扣费用不是同一分录。",
                  "enum": [
                    "reserve",
                    "capture",
                    "release",
                    "adjustment_credit",
                    "adjustment_debit"
                  ],
                  "type": "string"
                }
              },
              "required": [
                "entry_id",
                "type",
                "amount",
                "currency",
                "created_at"
              ],
              "type": "object"
            },
            "type": "array"
          },
          "metering": {
            "$ref": "#/components/schemas/ReservationMetering"
          },
          "pricing_snapshot": {
            "additionalProperties": false,
            "description": "创建时的客户销售计价快照。unit_price_usd_per_1m 已包含客户适用倍率/折扣，不能再次乘倍率；\n实际量计算金额=ROUND(completion_tokens / 1000000 × unit_price_usd_per_1m, rounding_scale)，\ncompletion_tokens 使用首次结算时已核实的实际用量，不能用 total_tokens 或预估量替代。\n首次实扣=MIN(实际量计算金额, reserved_amount)，不超过预冻结额，超出部分不自动追扣。\n后续人工调整以 entries 中 adjustment_credit/debit 独立反映，不覆盖快照。\nsettled_amount 为调整后的净额；不能把调整后 billable_tokens 再乘原单价当作所有人工调整的重建公式。\n不会返回火山成本、资源包或采购折扣。\n",
            "properties": {
              "currency": {
                "const": "USD",
                "type": "string"
              },
              "draft": {
                "type": "boolean"
              },
              "generation_mode": {
                "type": "string"
              },
              "input_video": {
                "type": "boolean"
              },
              "minimum_rule_version": {
                "type": "string"
              },
              "mode": {
                "description": "客户销售价所选计费场景；判定依据规范化请求及实际计量规则。",
                "enum": [
                  "without_input_video",
                  "with_input_video"
                ],
                "type": "string"
              },
              "price_rule_id": {
                "type": "string"
              },
              "resolution": {
                "type": "string"
              },
              "rounding_mode": {
                "const": "half_up",
                "type": "string"
              },
              "rounding_scale": {
                "const": 8,
                "type": "integer"
              },
              "service_tier": {
                "type": "string"
              },
              "unit": {
                "const": "million_video_tokens",
                "type": "string"
              },
              "unit_price_usd_per_1m": {
                "$ref": "#/components/schemas/PriceAmount"
              }
            },
            "required": [
              "price_rule_id",
              "mode",
              "unit",
              "unit_price_usd_per_1m",
              "currency",
              "rounding_mode",
              "rounding_scale"
            ],
            "type": "object"
          },
          "pricing_version": {
            "type": "string"
          },
          "released_amount": {
            "$ref": "#/components/schemas/MoneyAmount"
          },
          "reserved_amount": {
            "$ref": "#/components/schemas/MoneyAmount"
          },
          "settled_amount": {
            "$ref": "#/components/schemas/NullableMoneyAmount",
            "description": "未结算为 null；首次返回实际扣款，不超过预冻结额，超出部分不自动追扣。后续经审核调整后返回累计净客户金额，历史 capture 与 adjustment 分录保留，详情见 entries。"
          },
          "state": {
            "$ref": "#/components/schemas/BillingState"
          },
          "task_id": {
            "$ref": "#/components/schemas/TaskId"
          }
        },
        "required": [
          "task_id",
          "state",
          "currency",
          "reserved_amount",
          "settled_amount",
          "released_amount",
          "actual_usage",
          "billable_tokens",
          "pricing_version",
          "billing_rule_version",
          "pricing_snapshot",
          "entries"
        ],
        "type": "object"
      },
      "BillingState": {
        "description": "reserved=已冻结；pending_usage=待确定实际用量/费用；settled=已结算；released=已释放；adjusted=有后续调整。",
        "enum": [
          "reserved",
          "pending_usage",
          "settled",
          "released",
          "adjusted"
        ],
        "type": "string"
      },
      "ContentItem": {
        "discriminator": {
          "mapping": {
            "audio_url": "#/components/schemas/AudioContent",
            "draft_task": "#/components/schemas/DraftContent",
            "image_url": "#/components/schemas/ImageContent",
            "text": "#/components/schemas/TextContent",
            "video_url": "#/components/schemas/VideoContent"
          },
          "propertyName": "type"
        },
        "oneOf": [
          {
            "$ref": "#/components/schemas/TextContent"
          },
          {
            "$ref": "#/components/schemas/ImageContent"
          },
          {
            "$ref": "#/components/schemas/VideoContent"
          },
          {
            "$ref": "#/components/schemas/AudioContent"
          },
          {
            "$ref": "#/components/schemas/DraftContent"
          }
        ]
      },
      "CreateTaskRequest": {
        "additionalProperties": false,
        "allOf": [
          {
            "not": {
              "required": [
                "frames",
                "duration"
              ]
            }
          },
          {
            "if": {
              "properties": {
                "model": {
                  "const": "seedance-2.5"
                }
              }
            },
            "then": {
              "properties": {
                "resolution": {
                  "not": {
                    "const": "4k"
                  }
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "model": {
                  "enum": [
                    "seedance-2.0",
                    "seedance-2.0-fast",
                    "seedance-2.0-mini"
                  ]
                }
              }
            },
            "then": {
              "not": {
                "anyOf": [
                  {
                    "required": [
                      "omni_reference_task_type"
                    ]
                  },
                  {
                    "required": [
                      "output_format"
                    ]
                  }
                ]
              }
            }
          },
          {
            "if": {
              "properties": {
                "model": {
                  "enum": [
                    "seedance-2.0-fast",
                    "seedance-2.0-mini"
                  ]
                }
              }
            },
            "then": {
              "not": {
                "required": [
                  "frames"
                ]
              },
              "properties": {
                "draft": {
                  "const": false
                },
                "duration": {
                  "oneOf": [
                    {
                      "const": -1
                    },
                    {
                      "maximum": 15,
                      "minimum": 4
                    }
                  ]
                },
                "ratio": {
                  "enum": [
                    "16:9",
                    "4:3",
                    "1:1",
                    "3:4",
                    "9:16",
                    "21:9"
                  ]
                },
                "resolution": {
                  "enum": [
                    "480p",
                    "720p"
                  ]
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "content": {
                  "contains": {
                    "properties": {
                      "type": {
                        "const": "draft_task"
                      }
                    },
                    "required": [
                      "type"
                    ],
                    "type": "object"
                  }
                }
              }
            },
            "then": {
              "not": {
                "anyOf": [
                  {
                    "required": [
                      "duration"
                    ]
                  },
                  {
                    "required": [
                      "frames"
                    ]
                  },
                  {
                    "required": [
                      "ratio"
                    ]
                  },
                  {
                    "required": [
                      "seed"
                    ]
                  },
                  {
                    "required": [
                      "generate_audio"
                    ]
                  },
                  {
                    "required": [
                      "omni_reference_task_type"
                    ]
                  }
                ]
              },
              "properties": {
                "content": {
                  "maxItems": 1
                },
                "draft": {
                  "const": false
                },
                "resolution": {
                  "const": "1080p"
                }
              },
              "required": [
                "resolution"
              ]
            }
          }
        ],
        "description": "仅开放已核实的 Ark 字段。模型级上限、支持分辨率/角色组合等由对应能力版本二次校验。\n平台禁止同时提交 frames 与 duration，二者同传返回 422；不依赖官方优先级静默改写用户意图。\nduration=-1 只有模型已验证支持自动时长时可用，冻结按该能力的最大可能产出评估。\nprompt 中旧式 --dur/--duration/--rs/--resolution/--frames 等计费参数指令及规范化变体须拒绝，\n有歧义也返回 422 并提示改用结构化字段。本版本不开放任意 provider_params。\n基于 draft_task 的正式生成只允许唯一 draft_task 内容项且 resolution 必须为 1080p；\nduration/frames/ratio/seed/generate_audio/omni_reference_task_type 不得重传，这些有效参数继承 Draft。\n转正式不能同时设置 draft:true。首尾帧模式各最多一张，尾帧须有首帧，ratio 必须为 adaptive，\n不能混入参考图片、视频或音频。2.5 edit 需要恰好一个视频、adaptive 与 duration=-1；\nextend 需要恰好一个视频与 adaptive；这些组合还受已发布能力约束。\nreturn_last_frame/output_format/watermark/service_tier/execution_expires_after 的省略不表示继承，\n按官方正式任务默认值及当前能力版本解释。未在本契约公开的回调/priority 等字段不允许透传。\n",
        "properties": {
          "content": {
            "description": "契约的通用上界；每类数量、组合和总量还受当前模型能力版本的更小上限限制，不表示官方账号已支持全部组合。",
            "items": {
              "$ref": "#/components/schemas/ContentItem"
            },
            "maxItems": 51,
            "minItems": 1,
            "type": "array"
          },
          "draft": {
            "type": "boolean"
          },
          "duration": {
            "description": "秒。2.0、Fast、Mini 为 4–15 秒；2.5 为 4–30 秒；自动时长还受已发布能力限制。",
            "oneOf": [
              {
                "const": -1
              },
              {
                "maximum": 30,
                "minimum": 4
              }
            ],
            "type": "integer"
          },
          "execution_expires_after": {
            "description": "官方执行期限秒数，支持范围按模型能力校验，不是平台 HTTP 超时。",
            "minimum": 1,
            "type": "integer"
          },
          "expected_pricing_version": {
            "description": "平台价格版本前置条件；与生效版本不符为 409，不冻结、不提交上游。仅平台消费，不透传上游。",
            "maxLength": 128,
            "minLength": 1,
            "type": "string"
          },
          "frames": {
            "description": "模型支持时指定帧数；范围和步长按能力版本校验，禁止与 duration 同传。",
            "minimum": 1,
            "type": "integer"
          },
          "generate_audio": {
            "type": "boolean"
          },
          "max_charge_usd": {
            "$ref": "#/components/schemas/MoneyAmount",
            "description": "平台创建时最大冻结额守卫；仅平台消费，不透传上游。所需冻结超出该值时 409，不创建任务。该字段不是之后人工账单调整的金额锁。"
          },
          "model": {
            "$ref": "#/components/schemas/PublicModel"
          },
          "omni_reference_task_type": {
            "description": "仅 Seedance 2.5 已验证的多模态参考场景可用（参考图片、视频或音频）；纯文本及首帧/首尾帧请求须省略，显式传入返回 422。仅开放 reference 的能力在多模态参考请求省略本字段时补 reference，防止自动选择未开放模式。Draft 转正式片不得重传。不接受 task_type 别名。",
            "enum": [
              "auto",
              "reference",
              "edit",
              "extend"
            ],
            "type": "string"
          },
          "output_format": {
            "description": "Seedance 2.5 可选格式；仅对应能力已核实并启用时可用。",
            "enum": [
              "mp4",
              "mov"
            ],
            "type": "string"
          },
          "ratio": {
            "enum": [
              "16:9",
              "4:3",
              "1:1",
              "3:4",
              "9:16",
              "21:9",
              "adaptive"
            ],
            "type": "string"
          },
          "resolution": {
            "enum": [
              "480p",
              "720p",
              "1080p",
              "4k"
            ],
            "type": "string"
          },
          "return_last_frame": {
            "type": "boolean"
          },
          "seed": {
            "maximum": 2147483647,
            "minimum": -1,
            "type": "integer"
          },
          "service_tier": {
            "description": "本版公开契约仅开放 default，其他服务档未开放。",
            "enum": [
              "default"
            ],
            "type": "string"
          },
          "watermark": {
            "type": "boolean"
          }
        },
        "required": [
          "model",
          "content"
        ],
        "type": "object"
      },
      "DraftContent": {
        "additionalProperties": false,
        "properties": {
          "draft_task": {
