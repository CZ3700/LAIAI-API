        cascade=true、真人组或未启用删除能力均返回 422 unsupported_capability，不支持级联删除。
        有在途任务引用返回 409 resource_in_use。不会仅删除平台映射而留下未知上游结果。
        检查组内素材、在途引用并设置 deleting 屏障必须在同一事务锁内完成；
        素材新增和任务引用也检查该屏障，避免检查通过后新建素材或引用的竞态。
        首次接受 202；同一幂等键重复请求返回同一受理结果，已确认删除后重复请求 204；跨组织 404。
