        default:
          $ref: '#/components/responses/Error'
  /v1/video/portrait-authorizations:
    post:
      tags: [PortraitAuthorization]
      operationId: createPortraitAuthorization
      summary: 创建真人 H5 授权会话
      description: |
        异步调用官方 CreateVisualValidateSession 建立流程，creating 阶段尚无 H5 地址；
        创建结果不确定时为 submission_unknown，不允许盲重发官方创建请求。
        pending 时才返回 H5 地址，用户在该页面完成授权；
        平台通过 GetVisualValidateResult 核实结果，再把官方返回的组映射为本组织 ag_ ID。
        callback_url 仅可为预登记 HTTPS 回跳地址，不是可信的授权结果通知来源；
        H5 回跳本身、客户端参数或截图均不能将授权状态改为成功。
        需要已启用的租户素材路由/Portrait 能力、平台固定回调入口及有效回跳登记。H5 成功仅确认身份流程；
        真人素材仍需独立审核且未过期/撤销的 video_generation 业务许可，才能上传或参与任务。
        authorization_url 属敏感短期 URL，仅在授权会话响应返回，禁止写入普通日志。
      parameters:
        - $ref: '#/components/parameters/AssetIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [callback_url]
              properties:
                name:
                  type: string
                  maxLength: 64
                  description: 可选会话名称。
                description:
                  type: string
                  maxLength: 300
                  description: 可选会话说明。
                callback_url:
                  type: string
                  format: uri
                  pattern: '^https://'
                  maxLength: 2048
                  description: 必须精确匹配组织预登记的 HTTPS 回跳地址。
      responses:
        '202':
          description: |
            会话创建已持久化受理；火山 RPC 官方信封，Action=CreateVisualValidateSession。
            creating/submission_unknown 尚未获得可用 H5 地址，pending 等待本人完成授权。
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RpcEnvelope'
                  - type: object
                    properties:
                      Result:
                        $ref: '#/components/schemas/RpcCreatePortraitResult'
              example:
                ResponseMetadata: {RequestId: req_example009, Action: CreateVisualValidateSession, Version: '2024-01-01', Service: ark, Region: cn-beijing}
                Result: {SessionId: pas_example001, Status: creating}
        '400':
          description: |
            请求非法。缺 Idempotency-Key 头时 message 明确点名该头；
            callback_url 与组织预登记回跳地址不匹配时 message 明确要求先完成登记。
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: |
            provider_unavailable（retryable）——平台侧真人认证固定回调入口尚未配置，
            属于服务端状态而非请求错误；配置完成后重试即可，请求本身无需修改。
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [PortraitAuthorization]
      operationId: listPortraitAuthorizations
      summary: 列出当前组织的授权会话摘要
      description: 仅读平台库；列表不返回 authorization_url。授权会话不提供客户端写状态或伪造授权接口。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 授权会话摘要分页
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortraitAuthorizationSummary'
                  next_cursor:
                    type: [string, 'null']
        default:
          $ref: '#/components/responses/Error'
  /v1/video/portrait-authorizations/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SessionId'
    get:
      tags: [PortraitAuthorization]
      operationId: getPortraitAuthorization
      summary: 查询真人授权会话（官方 GetVisualValidateResult 信封）
      description: |
        火山 RPC 官方信封，Action=GetVisualValidateResult；CreatedAt 为 Unix 秒。
        状态只由平台核实官方结果后更新；succeeded 时 Result 附 GroupId（本组织 ag_ 映射）。
        pending 会话仅创建该会话的原 Key 可经审计读取有效 H5URL，其他 Key 返回 403。
        同一原 Key 在有效 pending 状态可再次 GET；官方认证凭证仍限一次认证。已失效或完成后不返回 H5URL。
        H5URL 属敏感短期 URL，禁止写入普通日志。
        未核实官方撤销/删除会话能力前不开放 DELETE；素材组删除也不等于撤销本人授权。
      responses:
        '200':
          description: 官方信封的授权会话及已核实结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RpcEnvelope'
                  - type: object
                    properties:
                      Result:
                        $ref: '#/components/schemas/RpcGetPortraitResult'
              example:
                ResponseMetadata: {RequestId: req_example010, Action: GetVisualValidateResult, Version: '2024-01-01', Service: ark, Region: cn-beijing}
                Result: {SessionId: pas_example001, Status: pending, CreatedAt: 1792713600, H5URL: 'https://visual.example.invalid/session?token=...'}
        default:
          $ref: '#/components/responses/Error'
  /v1/video/portrait-callback:
    get:
      tags: [PortraitAuthorization]
      operationId: consumePortraitBrowserCallback
      summary: 官方 H5 浏览器回跳入口（不供客户主动构造调用）
      security: []
      description: |
        只接受平台签发、绑定组织/会话/回跳登记且未消费的短期 state；不使用 Gateway Key。
        不信任 resultCode、GroupId 或任意 redirect 参数，不据此授予身份认证成功或业务许可。
        消费有效 state 后仅 303 到预登记 HTTPS 地址。客户业务代码应查询 portrait-authorizations 状态。
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: 平台与官方 H5 流程传递的敏感短期 opaque state；不得日志记录或自行生成。
      responses:
        '303':
          description: 已消费 state，跳转至预登记回跳地址。
          headers:
            Location:
              schema:
                type: string
                format: uri
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        '400':
          description: state/会话/回跳目标无效、过期或已消费；无响应体。
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    GatewayKey:
      type: http
      scheme: bearer
      bearerFormat: LAIAI Gateway API Key
      description: 平台签发的下游 Key，绝不使用或返回火山官方 Key。
  headers:
    IdempotencyReplayed:
      description: true 表示幂等重放已有结果，没有重复创建或冻结。
      schema:
        type: boolean
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        8–128 字符，由调用方为一次业务操作生成。唯一范围是组织、方法、包含资源 ID 的规范化路径、
        幂等键哈希；与 Gateway Key ID 无关。同请求重放同一任务/操作，不同请求 409。
        幂等键及规范化请求分别使用服务端 HMAC-SHA256 和不同的域标签，不保存明文摘要密钥；
        服务端 HMAC 密钥轮换需显式迁移；现有任务幂等版本不允许原位换密钥后静默再次创建。
        不得将同一个键用于不同业务请求。
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[!-~]+$'
    AssetIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 素材组、素材、H5 会话创建的幂等键；1–128 字符且不得含控制字符。同组织同路径同键同请求重放，内容冲突为 409 invalid_state。建议统一使用至少 8 位随机业务键。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TaskId'
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GroupId'
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AssetId'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: 平台签发的不透明游标，绑定组织和列表过滤条件；任务/事件最长 512 字符，素材/会话最长 1024 字符。原样使用，不跨列表复用。
      schema:
        type: string
        maxLength: 1024
  requestBodies:
    TaskCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateTaskRequest'
          example:
            model: seedance-2.0
            content:
              - type: text
                text: 一只纸质小船漂过平静湖面，柔和晨光。
            duration: 5
            resolution: 720p
            ratio: '16:9'
            generate_audio: false
  responses:
    Error:
      description: |
        安全错误。素材接口非法 JSON/缺少幂等键/非法网址为 400；任务参数或幂等键非法通常为 422；
        401=Key 无效；403=权限或真人业务许可不足；
        任务接口的素材校验错误映射为 403 forbidden、409 invalid_state 或 422 unsupported_capability；
        素材接口独立返回 authorization_required、resource_in_use、group_not_empty 等安全错误码。
        404=资源不存在或跨组织；409=幂等冲突/状态冲突；410=产物已过期；
        413=请求体超限；422=未验证或不支持的模型参数/素材组合；429=Token 配额/限流/并发限制；
        402=余额不足；500=素材服务内部失败；502/503=服务不可用（503 亦含平台侧
        真人认证回调未配置的 provider_unavailable，属可重试的服务端状态）。已接受的提交结果未知通过任务状态表达，
        不使用误导性的失败结果允许客户任意重新创建。错误 message 不包含上游原文、凭证或 PII。
      headers:
        X-Request-Id:
          description: 平台请求 ID
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 幂等键复用到不同请求，或任务/素材/授权/账务状态不允许当前操作。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OperationAccepted:
      description: 操作已持久化受理，非完成确认；按 poll_url 查询统一 operations 资源，不根据原资源 404 判断成功。
      headers:
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
  schemas:
    TaskId:
      type: string
      pattern: '^task_[A-Za-z0-9_-]+$'
      description: 平台任务 ID，不接受 cgt- 等上游 ID。
    GroupId:
      type: string
      pattern: '^ag_[A-Za-z0-9_-]+$'
      description: 平台素材组 ID。
    AssetId:
      type: string
      pattern: '^asset_[A-Za-z0-9_-]+$'
      description: 平台素材 ID。
    SessionId:
      type: string
      pattern: '^pas_[A-Za-z0-9_-]+$'
      description: 平台真人授权会话 ID，不暴露官方会话 ID。
    PublicModel:
      type: string
      enum: [seedance-2.0, seedance-2.5, seedance-2.0-fast, seedance-2.0-mini]
      description: 平台公开别名；Fast 对应 doubao-seedance-2-0-fast-260128，Mini 对应 doubao-seedance-2-0-mini-260615。是否可用以 models 返回 enabled 与 verified 为准。
    MoneyAmount:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,8})?$'
      description: 非负 USD 十进制字符串，最多 8 位小数，禁止 JSON 浮点金额。
      examples: ['0.12500000']
    NullableMoneyAmount:
      oneOf:
        - $ref: '#/components/schemas/MoneyAmount'
        - type: 'null'
    PriceAmount:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,24})?$'
      description: 客户单价及倍率相乘后的非负十进制字符串；单价保留精度可高于最终 USD 账款的 8 位，禁止 JSON 浮点金额。
    TaskStatus:
      type: string
      enum: [accepted, submitting, submission_unknown, queued, running, succeeded, failed, cancelled, expired]
      description: |
        accepted/submitting/submission_unknown 为平台提交状态；其余为已核实生成状态。
        expired 只能来自已确认的官方执行过期，不是平台查询超时。
    BillingState:
      type: string
      enum: [reserved, pending_usage, settled, released, adjusted]
      description: reserved=已冻结；pending_usage=待确定实际用量/费用；settled=已结算；released=已释放；adjusted=有后续调整。
    MediaType:
      type: string
      enum: [image, video, audio]
      description: 平台媒体类型；具体官方可用组合必须经能力验证，不以枚举出现即视作已支持。
    MediaUrl:
      type: string
      maxLength: 4096
      pattern: '^(https://[^\s]+|asset://asset_[A-Za-z0-9_-]+)$'
      description: HTTPS 资源或本组织 asset://asset_ 引用；不接受裸上游素材 ID 或上游 asset:// ID。
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [model, content]
      description: |
        仅开放已核实的 Ark 字段。模型级上限、支持分辨率/角色组合等由对应能力版本二次校验。
        平台禁止同时提交 frames 与 duration，二者同传返回 422；不依赖官方优先级静默改写用户意图。
        duration=-1 只有模型已验证支持自动时长时可用，冻结按该能力的最大可能产出评估。
        prompt 中旧式 --dur/--duration/--rs/--resolution/--frames 等计费参数指令及规范化变体须拒绝，
        有歧义也返回 422 并提示改用结构化字段。本版本不开放任意 provider_params。
        基于 draft_task 的正式生成只允许唯一 draft_task 内容项且 resolution 必须为 1080p；
        duration/frames/ratio/seed/generate_audio/omni_reference_task_type 不得重传，这些有效参数继承 Draft。
        转正式不能同时设置 draft:true。首尾帧模式各最多一张，尾帧须有首帧，ratio 必须为 adaptive，
        不能混入参考图片、视频或音频。2.5 edit 需要恰好一个视频、adaptive 与 duration=-1；
        extend 需要恰好一个视频与 adaptive；这些组合还受已发布能力约束。
        return_last_frame/output_format/watermark/service_tier/execution_expires_after 的省略不表示继承，
        按官方正式任务默认值及当前能力版本解释。未在本契约公开的回调/priority 等字段不允许透传。
      properties:
        model:
          $ref: '#/components/schemas/PublicModel'
        content:
          type: array
          minItems: 1
          maxItems: 51
          description: 契约的通用上界；每类数量、组合和总量还受当前模型能力版本的更小上限限制，不表示官方账号已支持全部组合。
          items:
            $ref: '#/components/schemas/ContentItem'
        duration:
          type: integer
          oneOf:
            - const: -1
            - minimum: 4
              maximum: 30
          description: 秒。2.0、Fast、Mini 为 4–15 秒；2.5 为 4–30 秒；自动时长还受已发布能力限制。
        frames:
          type: integer
          minimum: 1
          description: 模型支持时指定帧数；范围和步长按能力版本校验，禁止与 duration 同传。
        resolution:
          type: string
          enum: [480p, 720p, 1080p, 4k]
        ratio:
          type: string
          enum: ['16:9', '4:3', '1:1', '3:4', '9:16', '21:9', adaptive]
        seed:
          type: integer
          minimum: -1
          maximum: 2147483647
        generate_audio:
          type: boolean
        watermark:
          type: boolean
        return_last_frame:
          type: boolean
        draft:
          type: boolean
        service_tier:
          type: string
          enum: [default]
          description: 本版公开契约仅开放 default，其他服务档未开放。
        omni_reference_task_type:
          type: string
          enum: [auto, reference, edit, extend]
          description: 仅 Seedance 2.5 已验证的多模态参考场景可用（参考图片、视频或音频）；纯文本及首帧/首尾帧请求须省略，显式传入返回 422。仅开放 reference 的能力在多模态参考请求省略本字段时补 reference，防止自动选择未开放模式。Draft 转正式片不得重传。不接受 task_type 别名。
        output_format:
          type: string
          enum: [mp4, mov]
          description: Seedance 2.5 可选格式；仅对应能力已核实并启用时可用。
        execution_expires_after:
          type: integer
          minimum: 1
          description: 官方执行期限秒数，支持范围按模型能力校验，不是平台 HTTP 超时。
        max_charge_usd:
          $ref: '#/components/schemas/MoneyAmount'
          description: 平台创建时最大冻结额守卫；仅平台消费，不透传上游。所需冻结超出该值时 409，不创建任务。该字段不是之后人工账单调整的金额锁。
        expected_pricing_version:
          type: string
          minLength: 1
          maxLength: 128
          description: 平台价格版本前置条件；与生效版本不符为 409，不冻结、不提交上游。仅平台消费，不透传上游。
      allOf:
        - not:
            required: [frames, duration]
        - if:
            properties:
              model:
                const: seedance-2.5
          then:
            properties:
              resolution:
                not:
                  const: 4k
        - if:
            properties:
              model:
                enum: [seedance-2.0, seedance-2.0-fast, seedance-2.0-mini]
          then:
            not:
              anyOf:
                - required: [omni_reference_task_type]
                - required: [output_format]
        - if:
            properties:
              model:
                enum: [seedance-2.0-fast, seedance-2.0-mini]
          then:
            properties:
              resolution:
                enum: [480p, 720p]
              duration:
                oneOf:
                  - const: -1
                  - minimum: 4
                    maximum: 15
              draft:
                const: false
              ratio:
                enum: ['16:9', '4:3', '1:1', '3:4', '9:16', '21:9']
            not:
              required: [frames]
        - if:
            properties:
              content:
                contains:
                  type: object
                  required: [type]
                  properties:
                    type:
                      const: draft_task
          then:
            required: [resolution]
            properties:
              content:
                maxItems: 1
              resolution:
                const: 1080p
              draft:
                const: false
            not:
              anyOf:
                - required: [duration]
                - required: [frames]
                - required: [ratio]
                - required: [seed]
                - required: [generate_audio]
                - required: [omni_reference_task_type]
    ContentItem:
      oneOf:
        - $ref: '#/components/schemas/TextContent'
        - $ref: '#/components/schemas/ImageContent'
        - $ref: '#/components/schemas/VideoContent'
        - $ref: '#/components/schemas/AudioContent'
        - $ref: '#/components/schemas/DraftContent'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextContent'
          image_url: '#/components/schemas/ImageContent'
          video_url: '#/components/schemas/VideoContent'
          audio_url: '#/components/schemas/AudioContent'
          draft_task: '#/components/schemas/DraftContent'
    TextContent:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          const: text
        text:
          type: string
          minLength: 1
          maxLength: 20000
    MediaReference:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          $ref: '#/components/schemas/MediaUrl'
    ImageContent:
      type: object
      additionalProperties: false
      required: [type, image_url]
      properties:
        type:
          type: string
          const: image_url
        image_url:
          $ref: '#/components/schemas/MediaReference'
        role:
          type: string
          enum: ['', first_frame, last_frame, reference_image]
    VideoContent:
      type: object
      additionalProperties: false
      required: [type, video_url]
      properties:
        type:
          type: string
          const: video_url
        video_url:
          $ref: '#/components/schemas/MediaReference'
        role:
          type: string
          enum: ['', reference_video]
    AudioContent:
      type: object
      additionalProperties: false
      required: [type, audio_url]
      properties:
        type:
          type: string
          const: audio_url
        audio_url:
          $ref: '#/components/schemas/MediaReference'
        role:
          type: string
          enum: ['', reference_audio]
    DraftContent:
      type: object
      additionalProperties: false
      required: [type, draft_task]
      properties:
        type:
          type: string
          const: draft_task
        draft_task:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id:
              $ref: '#/components/schemas/TaskId'
    OfficialTaskQuery:
      type: object
      additionalProperties: false
      required: [id, model, status, created_at, updated_at]
      description: |
        官方查询任务形状。status 取值为平台生命周期枚举（含 accepted/submitting/submission_unknown
        平台提交阶段），不是官方四态原样映射。billing_state/sync_state/artifact_status/deletion_state
        等平台扩展不在本响应。
      properties:
        id:
          $ref: '#/components/schemas/TaskId'
        model:
          $ref: '#/components/schemas/PublicModel'
        status:
          $ref: '#/components/schemas/TaskStatus'
        created_at:
          type: integer
          description: 任务受理时间，Unix 秒。
        updated_at:
          type: integer
          description: 最近状态更新时间，Unix 秒。
        content:
          type: object
          additionalProperties: false
          description: 仅在已取得官方产物链接时出现。
          properties:
            video_url:
              type: string
              format: uri
              pattern: '^https://'
              description: 官方视频直链；保留签名参数，访问时不得附带 Gateway Key。
        usage:
          type: object
          additionalProperties: false
          required: [completion_tokens, total_tokens]
          description: 仅在已观察到官方用量时出现；字段缺失为 null，不以零或估算代填。
          properties:
            completion_tokens:
              type: [integer, 'null']
              minimum: 0
            total_tokens:
              type: [integer, 'null']
              minimum: 0
    OfficialTaskOperation:
      type: object
      additionalProperties: false
      required: [id, status, operation_id]
      description: 官方形状的任务取消/删除受理回执；接受不等于完成，以 operation_id 查询统一操作资源。
      properties:
        id:
          $ref: '#/components/schemas/TaskId'
        status:
          type: string
          enum: [cancelling, deleting]
        operation_id:
          type: string
          pattern: '^op_[A-Za-z0-9_-]+$'
    Task:
      type: object
      additionalProperties: false
      description: 平台任务扩展 DTO；当前仅任务列表接口（平台扩展，官方无列表接口）返回。官方形状的单查用 OfficialTaskQuery。
      required: [id, model, status, billing_state, usage, sync_state, artifact_status, created_at, updated_at, last_synced_at, deletion_state]
      properties:
        id:
          $ref: '#/components/schemas/TaskId'
        model:
          $ref: '#/components/schemas/PublicModel'
        status:
          $ref: '#/components/schemas/TaskStatus'
        billing_state:
          $ref: '#/components/schemas/BillingState'
        sync_state:
          type: string
          enum: [fresh, stale, needs_review]
          description: 平台观测状态，与生成终态和账单状态独立；needs_review 不等于任务失败。
        artifact_status:
          type: string
          enum: [pending, ready, failed, expired]
          description: 结果链接状态独立于生成与账务状态；ready 表示已取得官方链接，不承诺永久有效或平台托管。取件失败不改变已核实生成成功事实。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_synced_at:
          type: [string, 'null']
          format: date-time
        content_url:
          type: string
          format: uri
          pattern: '^https://'
          description: 官方视频直链，与 content.video_url 相同；保留签名参数，不附带 Gateway Key 访问。列表只返回已缓存的有效交付记录，单任务详情可受限查询上游更新。
        content:
          type: object
          additionalProperties: false
          properties:
            video_url:
              type: string
              format: uri
              pattern: '^https://'
            last_frame_url:
              type: string
              format: uri
              pattern: '^https://'
          description: 官方原始结果地址；仅包含实际返回的类型，平台不转存视频或尾帧。地址过期时可查询任务，不能保证官方重新签发。
        usage:
          oneOf:
            - $ref: '#/components/schemas/ActualUsage'
            - type: 'null'
        deletion_state:
          type: string
          enum: [none, pending]
          description: 删除完成后资源 GET 为 404；删除失败/未知应查询对应 operation，不由此字段推断。任务 DTO 不内嵌取消或删除操作。
    ActualUsage:
      type: object
      additionalProperties: false
      required: [completion_tokens, total_tokens]
      description: 官方实际返回的用量；字段缺失为 null，不以零或估算代填。不能假设 total_tokens 永远等于 completion_tokens。
      properties:
        completion_tokens:
          type: [integer, 'null']
          minimum: 0
        total_tokens:
          type: [integer, 'null']
          minimum: 0
    Operation:
      type: object
      additionalProperties: false
      required: [operation_id, kind, status, resource_id, poll_url, created_at]
      properties:
        operation_id:
          type: string
          pattern: '^op_[A-Za-z0-9_-]+$'
        request_id:
          type: string
          description: 素材操作的原始平台请求 ID，用于关联请求日志；不包含上游凭据或请求正文。
        kind:
          type: string
          description: 任务为 cancel_task/delete_task；素材操作保留动作名，如 CreateAssetGroup、CreateAsset、UpdateAssetGroup、UpdateAsset、DeleteAssetGroup、DeleteAsset、CreateVisualValidateSession。
        status:
          type: string
          enum: [pending, in_flight, sending, unknown, confirmed, rejected]
          description: 任务发送态为 in_flight，素材操作发送态为 sending；只有 confirmed 证明完成，unknown 不凭响应超时或 404 推断完成。
        resource_id:
          type: string
          pattern: '^(task_|ag_|asset_|pas_)[A-Za-z0-9_-]+$'
        poll_url:
          type: string
          pattern: '^/v1/video/operations/op_[A-Za-z0-9_-]+$'
          description: 统一操作查询路径，资源删除后仍可查。操作或原资源 404 均不表示成功。
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
          description: 素材操作返回；pending/sending/unknown 为 null，confirmed/rejected 为完成时间。任务操作不返回此字段。
        error:
          $ref: '#/components/schemas/SafeError'
          description: 素材操作有安全错误投影时出现；任务操作不返回该字段。
    Estimate:
      type: object
      additionalProperties: false
      required: [model, estimated_tokens, maximum_reserved_tokens, estimated_amount, reserved_amount, currency, capability_version, pricing_version, billing_rule_version, guaranteed_price]
      properties:
        model:
          $ref: '#/components/schemas/PublicModel'
        estimated_tokens:
          type: integer
          minimum: 0
        maximum_reserved_tokens:
          type: integer
          minimum: 0
        estimated_amount:
          $ref: '#/components/schemas/MoneyAmount'
        reserved_amount:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          type: string
          const: USD
        capability_version:
          type: string
        pricing_version:
          type: string
        billing_rule_version:
          type: string
        guaranteed_price:
          type: boolean
          const: false
        metering:
          $ref: '#/components/schemas/ReservationMetering'
        price:
          $ref: '#/components/schemas/VideoPrice'
    ModelInfo:
      type: object
      additionalProperties: false
      required: [id, enabled, verified, capability_version, pricing_version, billing_rule_version, capabilities, prices]
      properties:
        id:
          $ref: '#/components/schemas/PublicModel'
        enabled:
          type: boolean
        verified:
          type: boolean
          description: 平台管理员发布的能力已核验标记，不代表本文档示例或 mock 测试已经完成该账号的官方真机验收。创建仍检查当前能力、价格与租户策略。
        capability_version:
          type: string
        pricing_version:
          type: string
        billing_rule_version:
          type: string
        capabilities:
          type: object
          additionalProperties: false
          required: [resolutions, max_duration_seconds, automatic_duration, frames, input_video, input_audio, draft, portrait_assets]
          properties:
            resolutions:
              type: array
              items:
                type: string
                enum: [480p, 720p, 1080p, 4k]
            max_duration_seconds:
              type: integer
              minimum: 1
            automatic_duration:
              type: boolean
            frames:
              type: boolean
            input_video:
              type: boolean
            input_audio:
              type: boolean
            draft:
              type: boolean
            portrait_assets:
              type: boolean
              description: 当前组织、该模型官方 scope 的素材路由及 Portrait 能力已启用，且允许异步执行暂存；仅表示能力可用，不代表某会话已认证或某素材已获有效业务许可。
        prices:
          type: array
          description: 本组织客户售价规则，不是火山账单价格或平台采购成本。
          items:
            $ref: '#/components/schemas/VideoPrice'
    VideoPrice:
      type: object
      additionalProperties: false
      required: [price_rule_id, label, mode, resolution, input_video, service_tier, draft, unit, amount, currency, minimum_rule_version]
      properties:
        price_rule_id:
          type: string
        label:
          type: string
          description: 仅用于展示。计价键使用结构化字段，完整请求先调用 estimates。
        mode:
          type: string
          enum: [generate, edit, extend, draft_conversion]
        resolution:
          type: string
          enum: [480p, 720p, 1080p, 4k]
        input_video:
          type: boolean
        service_tier:
          type: string
        draft:
          type: boolean
        minimum_rule_version:
          type: string
        unit:
          type: string
          const: million_video_tokens
        amount:
          $ref: '#/components/schemas/PriceAmount'
        currency:
          type: string
          const: USD
    ReservationMetering:
      type: object
      additionalProperties: false
      description: 创建时预冻结的计量依据，不等于官方实际 usage。历史未记录的维度为空，时长来源 unknown，视频数量 null；不回填猜测值。
      properties:
        mode:
          type: string
        resolution:
          type: string
        ratio:
          type: string
        service_tier:
          type: string
        draft:
          type: boolean
        input_video:
          type: boolean
        input_video_count:
          type: [integer, 'null']
          minimum: 0
        input_duration_ms:
          type: integer
        input_duration_source:
          type: string
          enum: [none, verified_media, configured_upper_bound, draft_inherited, unknown]
        output_duration_ms:
          type: integer
        output_frames:
          type: integer
        width:
          type: integer
        height:
          type: integer
        fps_numerator:
          type: integer
        fps_denominator:
          type: integer
        minimum_tokens:
          type: integer
        minimum_rule_version:
          type: string
        capability_version:
          type: string
        input_token_semantics:
          type: string
          const: not_projected_separately_completion_tokens_authoritative
          description: 平台不单列输入 Token，按核实的 completion_tokens 结算；不声称官方输入用量为零。
        usage_semantics:
          type: string
          const: reservation_upper_bound
    Billing:
      type: object
      additionalProperties: false
      required: [task_id, state, currency, reserved_amount, settled_amount, released_amount, actual_usage, billable_tokens, pricing_version, billing_rule_version, pricing_snapshot, entries]
      properties:
        task_id:
          $ref: '#/components/schemas/TaskId'
        state:
          $ref: '#/components/schemas/BillingState'
        currency:
          type: string
          const: USD
        reserved_amount:
          $ref: '#/components/schemas/MoneyAmount'
        settled_amount:
          $ref: '#/components/schemas/NullableMoneyAmount'
          description: 未结算为 null；首次返回实际扣款，不超过预冻结额，超出部分不自动追扣。后续经审核调整后返回累计净客户金额，历史 capture 与 adjustment 分录保留，详情见 entries。
        released_amount:
          $ref: '#/components/schemas/MoneyAmount'
        actual_usage:
          oneOf:
            - $ref: '#/components/schemas/ActualUsage'
            - type: 'null'
        billable_tokens:
          type: [integer, 'null']
          minimum: 0
          description: 已确认的客户计费用量；未知为 null，最低计费量和官方 usage 的区别由规则版本定义。
        pricing_version:
          type: string
        billing_rule_version:
          type: string
        metering:
          $ref: '#/components/schemas/ReservationMetering'
        pricing_snapshot:
          type: object
          additionalProperties: false
          required: [price_rule_id, mode, unit, unit_price_usd_per_1m, currency, rounding_mode, rounding_scale]
          description: |
            创建时的客户销售计价快照。unit_price_usd_per_1m 已包含客户适用倍率/折扣，不能再次乘倍率；
            实际量计算金额=ROUND(completion_tokens / 1000000 × unit_price_usd_per_1m, rounding_scale)，
            completion_tokens 使用首次结算时已核实的实际用量，不能用 total_tokens 或预估量替代。
            首次实扣=MIN(实际量计算金额, reserved_amount)，不超过预冻结额，超出部分不自动追扣。
            后续人工调整以 entries 中 adjustment_credit/debit 独立反映，不覆盖快照。
            settled_amount 为调整后的净额；不能把调整后 billable_tokens 再乘原单价当作所有人工调整的重建公式。
            不会返回火山成本、资源包或采购折扣。
          properties:
            price_rule_id:
              type: string
            mode:
              type: string
              enum: [without_input_video, with_input_video]
              description: 客户销售价所选计费场景；判定依据规范化请求及实际计量规则。
            generation_mode:
              type: string
            resolution:
              type: string
            input_video:
              type: boolean
            service_tier:
              type: string
            draft:
              type: boolean
            minimum_rule_version:
              type: string
            unit:
              type: string
              const: million_video_tokens
            unit_price_usd_per_1m:
              $ref: '#/components/schemas/PriceAmount'
            currency:
              type: string
              const: USD
            rounding_mode:
              type: string
              const: half_up
            rounding_scale:
              type: integer
              const: 8
        entries:
          type: array
          description: 已持久化客户账务分录；不暴露供应商成本和内部科目。
          items:
            type: object
            additionalProperties: false
            required: [entry_id, type, amount, currency, created_at]
            properties:
              entry_id:
                type: string
                pattern: '^be_[A-Za-z0-9_-]+$'
              type:
                type: string
                enum: [reserve, capture, release, adjustment_credit, adjustment_debit]
                description: amount 总为非负；adjustment_credit 减少净费用，adjustment_debit 增加净费用。释放未消费冻结额与退回已扣费用不是同一分录。
              amount:
                $ref: '#/components/schemas/MoneyAmount'
              currency:
                type: string
                const: USD
              created_at:
                type: string
                format: date-time
    TaskEvent:
      type: object
      additionalProperties: false
      required: [id, type, created_at, request_id]
      properties:
        id:
          type: string
          pattern: '^evt_[A-Za-z0-9_-]+$'
        type:
          type: string
          enum: [task.accepted, task.submitting, task.submission_unknown, task.status_changed, task.cancelled, task.deletion_requested, task.operation_updated, billing.settled, billing.released, billing.pending_usage, billing.adjusted]
        created_at:
          type: string
          format: date-time
        request_id:
          type: string
          description: 平台请求或后台操作追踪 ID，不是火山 request ID。
        from_status:
          $ref: '#/components/schemas/TaskStatus'
        to_status:
          $ref: '#/components/schemas/TaskStatus'
    RpcEnvelope:
      type: object
      additionalProperties: false
      required: [ResponseMetadata, Result]
      description: |
        Volcengine RPC 官方响应信封。RequestId 为平台请求 ID（与 X-Request-Id 头一致）；
        Action 对应官方接口动作名。Result 内字段为 PascalCase。
      properties:
        ResponseMetadata:
          type: object
          additionalProperties: false
          required: [RequestId, Action, Version, Service, Region]
          properties:
            RequestId:
              type: string
            Action:
              type: string
            Version:
              type: string
              const: '2024-01-01'
            Service:
              type: string
              const: ark
            Region:
              type: string
              const: cn-beijing
        Result:
          type: object
          description: 官方动作结果，字段 PascalCase；具体结构由各接口的 Result schema 约束。
    RpcGroupStatus:
      type: string
      enum: [creating, ready, needs_review, failed, deleting]
      description: 平台素材组状态取值（形状按官方，取值为平台语义）。
    RpcAssetStatus:
      type: string
      enum: [creating, processing, ready, needs_review, failed, deleting]
      description: 平台素材状态取值（形状按官方，取值为平台语义）。
    RpcCreateAssetGroupResult:
      type: object
      additionalProperties: false
      required: [Id, Name, Status]
      properties:
        Id:
          $ref: '#/components/schemas/GroupId'
        Name:
          type: string
        Status:
          $ref: '#/components/schemas/RpcGroupStatus'
    RpcGetAssetGroupResult:
      type: object
      additionalProperties: false
      required: [Id, Name, Status, AssetCount, Version, CreatedAt, UpdatedAt]
      properties:
        Id:
          $ref: '#/components/schemas/GroupId'
        Name:
          type: string
        Status:
          $ref: '#/components/schemas/RpcGroupStatus'
        AssetCount:
          type: integer
          minimum: 0
        Version:
          type: integer
          minimum: 1
          description: 平台扩展字段（官方无此字段）；PATCH expected_version 乐观锁的读取来源。
        CreatedAt:
          type: integer
          description: Unix 秒。
        UpdatedAt:
          type: integer
          description: Unix 秒。
    RpcAssetGroupItem:
      type: object
      additionalProperties: false
      required: [Id, Name, Status, AssetCount]
      properties:
        Id:
          $ref: '#/components/schemas/GroupId'
        Name:
          type: string
        Status:
          $ref: '#/components/schemas/RpcGroupStatus'
        AssetCount:
          type: integer
          minimum: 0
    RpcListAssetGroupsResult:
      type: object
      additionalProperties: false
      required: [Items, NextCursor]
      properties:
        Items:
          type: array
          items:
            $ref: '#/components/schemas/RpcAssetGroupItem'
        NextCursor:
          type: string
          description: 空字符串表示末页；非空时作为 cursor 参数继续翻页。
    RpcCreateAssetResult:
      type: object
      additionalProperties: false
      required: [Id, GroupId, AssetType, Status]
      properties:
        Id:
          $ref: '#/components/schemas/AssetId'
        GroupId:
          $ref: '#/components/schemas/GroupId'
        AssetType:
          $ref: '#/components/schemas/MediaType'
        Status:
          $ref: '#/components/schemas/RpcAssetStatus'
    RpcGetAssetResult:
      type: object
      additionalProperties: false
      required: [Id, GroupId, AssetType, Status, URL, Version, CreatedAt, UpdatedAt]
      properties:
        Id:
          $ref: '#/components/schemas/AssetId'
        GroupId:
          $ref: '#/components/schemas/GroupId'
        AssetType:
          $ref: '#/components/schemas/MediaType'
        Status:
          $ref: '#/components/schemas/RpcAssetStatus'
        URL:
          type: string
          description: 平台素材引用 asset://asset_...；仅 ready 后非空，此前为空字符串。
        Version:
          type: integer
          minimum: 1
          description: 平台扩展字段（官方无此字段）；PATCH expected_version 乐观锁的读取来源。
        CreatedAt:
          type: integer
          description: Unix 秒。
        UpdatedAt:
          type: integer
          description: Unix 秒。
    RpcAssetItem:
      type: object
      additionalProperties: false
      required: [Id, GroupId, AssetType, Status]
      properties:
        Id:
          $ref: '#/components/schemas/AssetId'
        GroupId:
          $ref: '#/components/schemas/GroupId'
        AssetType:
          $ref: '#/components/schemas/MediaType'
        Status:
          $ref: '#/components/schemas/RpcAssetStatus'
    RpcListAssetsResult:
      type: object
      additionalProperties: false
      required: [Items, NextCursor]
      properties:
        Items:
          type: array
          items:
            $ref: '#/components/schemas/RpcAssetItem'
        NextCursor:
          type: string
          description: 空字符串表示末页；非空时作为 cursor 参数继续翻页。
    RpcDeleteResult:
      type: object
      additionalProperties: false
      required: [Id, Status]
      properties:
        Id:
          type: string
          description: 平台资源 ID（ag_/asset_）。
        Status:
          type: string
          const: deleting
    RpcPortraitStatus:
      type: string
      enum: [creating, submission_unknown, pending, succeeded, failed, expired]
      description: 平台授权会话状态取值；创建结果未知不得盲重发官方请求。
    RpcCreatePortraitResult:
      type: object
      additionalProperties: false
      required: [SessionId, Status]
      properties:
        SessionId:
          $ref: '#/components/schemas/SessionId'
        Status:
          $ref: '#/components/schemas/RpcPortraitStatus'
    RpcGetPortraitResult:
      type: object
      additionalProperties: false
      required: [SessionId, Status, CreatedAt]
      properties:
        SessionId:
          $ref: '#/components/schemas/SessionId'
        Status:
          $ref: '#/components/schemas/RpcPortraitStatus'
        CreatedAt:
          type: integer
          description: Unix 秒。
        GroupId:
          $ref: '#/components/schemas/GroupId'
          description: 仅 succeeded 时出现；本组织真人素材组映射。
        H5URL:
          type: string
          format: uri
          pattern: '^https://'
          description: 仅 pending 且为创建会话的原 Key 时出现；官方 H5 授权页短期敏感 URL，禁止写入普通日志。
    PortraitAuthorizationSummary:
      type: object
      additionalProperties: false
      required: [session_id, status, expires_at, created_at]
      properties:
        session_id:
          $ref: '#/components/schemas/SessionId'
        status:
          type: string
          enum: [creating, submission_unknown, pending, succeeded, failed, expired]
        expires_at:
          type: [string, 'null']
          format: date-time
          description: H5 认证凭证到期时间；官方凭证有效 30 分钟且单次认证，未取得凭证时为 null，不是肖像业务许可期限。
        created_at:
          type: string
          format: date-time
        group_id:
          $ref: '#/components/schemas/GroupId'
      allOf:
        - if:
            properties:
              status:
                const: succeeded
          then:
            required: [group_id]
          else:
            not:
              required: [group_id]
    SafeErrorCode:
      type: string
      enum: [invalid_request, unauthenticated, forbidden, insufficient_scope, video_execution_not_enabled, not_found, idempotency_conflict, invalid_state, insufficient_balance, quota_exceeded, rate_limited, unsupported_capability, invalid_asset, authorization_required, authorization_expired, group_not_empty, resource_in_use, content_expired, content_not_ready, provider_unavailable, submission_uncertain, generation_failed, cancellation_failed, deletion_failed, internal_error]
      description: 平台白名单错误码，不透传上游自由文本或内部分类。
    SafeError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          $ref: '#/components/schemas/SafeErrorCode'
        message:
          type: string
          maxLength: 300
          description: 安全合成文案，不含 prompt、素材 URL、PII、上游凭证/ID/错误原文。
        param:
          type: string
          enum: [model, content, resolution, ratio, duration, frames, seed, service_tier, generate_audio, return_last_frame, draft, execution_expires_after, omni_reference_task_type, output_format, max_charge_usd, expected_pricing_version]
          description: 可选的失败参数名，仅用于 422 参数或能力校验失败。查询 /v1/video/models 获取该模型的已发布能力；例如 Mini 使用 480p 或 720p，不接受 420p。
        retryable:
          type: boolean
          description: |
            是否可按既有幂等语义重试同一平台操作；true 也不允许改幂等键重建未知任务。
            操作结果 unknown 应查询 operations 或任务状态，不能据此盲重发上游请求。
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          $ref: '#/components/schemas/SafeError'
        request_id:
          type: string
          description: 平台请求 ID。
