        image/video/audio 只有当前账号/项目对应能力显式启用时允许提交，不支持组合返回 422。
        url 可为未预登记的公网 HTTPS 素材地址，由火山下载、保存并异步处理；平台不保存媒体字节。
        拒绝含用户认证信息、明显私有地址或非法协议的网址，URL 仅进入加密执行内容。
        官方 Active 不代表取得尺寸、时长或 SHA；已入库图片可在权限允许时引用。
        视频及音频缺少可靠时长时生成引用暂不可用，注册和查询仍可用，不按 0 时长计价。
        接受不等于审核通过；仅 status=ready 的资产可用于任务，平台 asset:// 引用会在内部转换。
