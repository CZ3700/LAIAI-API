openapi: 3.1.0
info:
  title: LAIAI Seedance 视频 API 实现契约
  version: 1.0.0-integration
  description: |
    按当前集成代码校正；不是上线公告。示例均为说明性示例，不是火山官方真机验证证据。
    沿用平台 /v1/video/generations，使用平台 Gateway Bearer Key。平台模型、任务、素材组、
    素材、授权会话 ID 均由平台管理；客户端不得提交火山 Key、上游任务/素材/组 ID 或任意 provider_params。
    所有资源读取与引用强制 org_id 隔离，资源 ID 不构成授权。一个下游客户应有独立组织边界；
    素材按组织和创建者隔离；同一具名用户的多个 Key 可访问本人资源，无具名用户的 Key 各自隔离。
    GET 列表仅查询授权的平台记录，不开放上游全账户枚举；共享项目配置不共享客户资源。
    网关、模型能力、客户价格、供应商预算、路由与租户执行保留策略均须显式配置。
    Seedance 视频及尾帧直接返回官方 HTTPS 签名地址，平台不存储或代理媒体字节。
    结果链接有效期由上游决定；读取任务时使用平台 Key，访问结果链接时不得附带平台 Key。
    未配置默认禁用；标准 2.0/2.5 与 2.0 Fast/Mini 出现在契约中不代表账号已取得官方能力或模型已上线。
    GET 要求 video:read，POST/PATCH/DELETE（含预估）要求 video:write；video:* 或 * 覆盖二者。
    POST 创建、取消、素材创建、授权创建、素材 PATCH 和单素材 DELETE 要求 Idempotency-Key；唯一作用域为
    (org_id, HTTP method, normalized canonical resource path, HMAC-SHA256(Idempotency-Key))。
    路径包含实际资源 ID；哈希针对幂等键而非 Gateway Key。同组织 Key 轮换不会重新派单，
    但 pending 真人会话的 H5 URL 仅创建该会话的原 Key 可读取；换 Key 重放可能返回 403。
    同键同规范化请求返回原资源或操作；同键不同请求为 409。首次资源创建返回 202；重放返回原业务结果，
    不重新提交上游或重复冻结。幂等键与请求体分别计算服务端 HMAC，并使用不同的域标签；
    不落明文密钥，仅保存摘要及密钥版本引用。服务端 HMAC 密钥不能直接替换，需显式迁移，不能因换密钥再次派单。
    平台先持久化请求意图、请求 HMAC 和幂等记录，再执行可能计费的操作。
    上游提交结果不确定进入 submission_unknown，禁止自动跨渠道重发及按本地超时退款。
    原始上游 ID、凭证、成本、内部路由和原始错误不对客户公开。金额采用十进制字符串，币种 USD。
    billing 是客户账单，供应商成本和对账差异属于内部账。任务状态、账单状态和删除状态相互独立。
    所有写入前校验错误均无生成提交；操作已被接受后发生的网络不确定性通过任务或操作状态查询。
    核心请求元数据、状态事件和账务证据必须持久化；敏感 payload 按 Invocation Store 的加密、
    保留期和解密审计边界保存。本文档不承诺将原文请求或账单成本直接暴露为 events。
    火山体系接口的响应按官方原生形状原路返回：任务提交/查询/取消/删除采用官方 data-plane
    JSON 形状（字段名小写下划线）；素材组、素材与真人授权采用官方 RPC 信封
    {ResponseMetadata:{RequestId,Action,Version,Service,Region},Result:{...}}（Result 内字段
    为 PascalCase）。形状对齐官方，取值仍为平台语义：ID 是平台 ID（非上游 cgt-/官方组 ID），
    任务 status 取平台生命周期枚举（含 accepted/submitting/submission_unknown 平台阶段），
    时间戳为 Unix 秒。平台账务、准入、幂等与审计全部保留。
servers:
  - url: https://api.example.invalid
    description: 占位域名；调用时替换为已部署平台域名。
security:
  - GatewayKey: []
tags:
  - name: Tasks
    description: 视频任务、产物与客户账单
  - name: Models
    description: 已验证能力、客户价格与预估
  - name: Assets
    description: 平台素材及素材组
  - name: PortraitAuthorization
    description: 真人 H5 授权流程
paths:
  /v1/video/models:
    get:
      tags: [Models]
      operationId: listVideoModels
      summary: 查询当前组织可见的视频模型及能力版本
      description: 返回平台配置与 Key 模型白名单的交集，可为空。enabled/verified 是必要条件，创建仍检查实时价格、预算、渠道和租户策略。价格是客户售价，不包含上游成本。
      responses:
        '200':
          description: 模型能力与公开价格
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelInfo'
        default:
          $ref: '#/components/responses/Error'
  /v1/video/estimates:
    post:
      tags: [Models]
      operationId: estimateVideoTask
      summary: 预估任务 Token、客户费用与冻结额
      description: |
        不提交上游、不冻结、不计生成费用。输入与创建请求一致。预估不是保证价或最终账单，
        也不是可复用的价格锁；创建时重新验证能力、参数、资产与价格并形成不可变快照。
        duration=-1、frames、输入视频和最低计费 Token 按返回的规则版本计算；frames 与 duration 同传为 422。
        无法确定安全上界或未验证的输入组合返回 422，不能静默采用任意固定上限。
      requestBody:
        $ref: '#/components/requestBodies/TaskCreate'
      responses:
        '200':
          description: 当前配置下的预估结果，不锁价、不冻结。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estimate'
        default:
          $ref: '#/components/responses/Error'
  /v1/video/generations:
    post:
      tags: [Tasks]
      operationId: createVideoTask
      summary: 创建视频任务
      description: |
        首次受理返回 202 和平台 task_ ID。模型映射、素材引用和计费参数在受理前验证。
        不接受任意裸上游标识。asset://asset_ 引用须属于当前组织且已就绪；真人素材组须授权有效。
        draft_task 只能引用本组织成功的 Draft，且模型、能力版本、官方账号/区域/项目一致，父任务未删除。
        原始 HTTPS 图片/音频地址直接透传官方；原始视频须有经验证的模型总输入视频时长上界，按聚合上界冻结。
        不声明外部 URL 不可变；已登记不可变素材或 asset:// 引用可使用可信测量时长。后续结算依官方用量证据。
        参数名沿 Ark 方言，平台严格按已验证模型能力允许的参数组合透传。
        HTTP 超时不等于生成失败；重试时必须复用同一 Idempotency-Key。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/TaskCreate'
      responses:
        '202':
          description: |
            官方 Submit 形状：仅 {"id": "<平台 task_ ID>"}。幂等重放同一形状与同一 ID
            （Idempotency-Replayed: true），不退回平台全量 DTO；账务/同步/产物等平台扩展
            请分别查询 /billing、/events 与列表接口。
          headers:
            Location:
              description: 平台任务查询路径
              schema:
                type: string
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id:
                    $ref: '#/components/schemas/TaskId'
              example:
                id: task_example001
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [Tasks]
      operationId: listVideoTasks
      summary: 列出当前组织的视频任务
      description: |
        仅查询本组织平台数据库；默认不包含已软删除任务。游标不可跨组织使用。
        列表是平台扩展（官方无对应列表接口），返回平台 Task DTO；官方形状的单任务查询用 GET /generations/{task_id}。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: model
          in: query
          schema:
            $ref: '#/components/schemas/PublicModel'
      responses:
        '200':
          description: 任务分页
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  next_cursor:
                    type: [string, 'null']
        default:
          $ref: '#/components/responses/Error'
  /v1/video/generations/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getVideoTask
      summary: 查询视频任务（官方 Query 形状）
      description: |
        按官方查询任务形状返回 id/model/status/content/usage；时间戳为 Unix 秒整数。
        status 取值为平台生命周期枚举（accepted/submitting/submission_unknown 为平台提交阶段，
        其余为已核实生成状态），不是官方四态原样映射。
        content.video_url 仅在已取得官方产物链接时出现；usage 仅在已观察到官方用量时出现，
        其内字段缺失为 null，不以 0 或估算代填。
        billing_state、sync_state、artifact_status、deletion_state 等平台扩展不在本响应，
        分别查询 /billing、/events 与列表接口。查询不产生新的生成任务，也不额外收生成费。
        不存在、跨组织或已完成软删除均返回 404。本地观察超时保持可核对状态，
        不凭观察超时将任务宣告 failed 或自动全退。
      responses:
        '200':
          description: 官方 Query 形状的任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialTaskQuery'
              example:
                id: task_example001
                model: seedance-2.0
                status: succeeded
                created_at: 1792713600
                updated_at: 1792713700
                content:
                  video_url: https://ark-cdn.example.invalid/video.mp4?Expires=...
                usage:
                  completion_tokens: 123
                  total_tokens: 999
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Tasks]
      operationId: deleteVideoTask
      summary: 删除已结束且账务已落定的视频任务
      description: |
        仅允许 succeeded/failed/cancelled/expired 且 billing_state 为 settled/released/adjusted。
        accepted/submitting/submission_unknown/queued/running 或 pending_usage 均返回 409。
        首次接受返回 202 operation_id；删除过程中重复请求返回同一操作。
        cancelled 仅本地软删除，不再发上游 DELETE；其他终态按官方可删除状态执行并确认。
        上游删除失败或结果未知不能伪造完成。已完成重复删除返回 204；跨组织仍为 404。
        删除不退款，不物理删除账务或安全审计记录。完成后任务 GET 返回 404，账单和安全事件按保留策略可查。
      responses:
        '202':
          description: 官方形状受理回执 {id, status:"deleting", operation_id}；完成与否以 operations 资源为准。
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialTaskOperation'
              example:
                id: task_example001
                status: deleting
                operation_id: op_example001
        '204':
          description: 当前组织任务的删除已经完成，无响应体。
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
  /v1/video/generations/{task_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: cancelVideoTask
      summary: 请求取消视频任务
      description: |
        accepted 且事务确认尚未派单可在同一事务内标 cancelled、释放冻结并确认取消操作。
        submitting/submission_unknown 可返回 202 记录取消意愿，查明前不得发上游 DELETE 或释放冻结。
        已确认 queued 时有条件调用官方 DELETE，running 返回 409 invalid_state。
        请求不得包含非空 body。接受操作不等于取消成功；按返回的 operation_id 查询统一操作资源。
        queued 可能在 DELETE 前变成 succeeded；官方 DELETE 此时可能删除成功记录。
        因此 DELETE 返回 200 加随后 GET 404 不是取消成功或零费用证据，须进入 operation=unknown 待核对。
        仅本地未派单的原子取消或充分官方取消证据才能转 cancelled 并释放冻结。
        同 Idempotency-Key 重放原操作；不同幂等键对已 cancelled 的任务返回已确认操作且不重复退款。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 官方形状受理回执 {id, status:"cancelling", operation_id}；按 operation_id 查询统一操作资源。
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialTaskOperation'
              example:
                id: task_example001
                status: cancelling
                operation_id: op_example001
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
  /v1/video/operations/{operation_id}:
    parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^op_[A-Za-z0-9_-]+$'
    get:
      tags: [Tasks]
      operationId: getVideoOperation
      summary: 查询取消或删除操作
      description: |
        独立持久化操作资源，当前查询任务取消、任务删除和虚拟空素材组删除，强制组织隔离。
        pending/in_flight/sending/unknown 均非成功；只有 confirmed 表示有充分证据确认该操作完成。
        rejected 表示操作被拒绝。任务操作不返回 error/completed_at；素材组操作可提供安全 error 和完成时间。
        创建任务/素材/会话请查询各自资源，不通过此接口枚举内部创建操作。原资源已删除后仍可查询删除操作。
        本接口或原资源 GET 返回 404 均不代表操作成功，不得据此退款或删除本地账务证据。
      responses:
        '200':
          description: 持久化操作状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/Error'
  /v1/video/generations/{task_id}/content:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getVideoContent
      summary: 获取成功任务的视频或尾帧直链
      description: |
        经过平台鉴权及组织归属校验后返回链接 JSON，不再返回媒体流或重定向。
        优先使用任务详情的 content.video_url / content.last_frame_url。
        客户自行访问 url，不向外站发送 Gateway Bearer。签名参数须原样保留，有效期由上游决定。
        无额外生成收费；链接未取得返回 409，链接结果已失效返回 410，官方查询失败可能返回 503。
        kind=last_frame 仅请求过 return_last_frame 且官方返回尾帧时可用。链接失败不应重新创建任务。
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [video, last_frame]
            default: video
      responses:
        '200':
          description: 官方产物链接；平台不持久化媒体文件。
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url, kind, source]
                properties:
                  url:
                    type: string
                    format: uri
                    pattern: '^https://'
                  kind:
                    type: string
                    enum: [video, last_frame]
                  source:
                    type: string
                    const: upstream
        default:
          $ref: '#/components/responses/Error'
  /v1/video/generations/{task_id}/billing:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getVideoBilling
      summary: 查询单任务客户账单
      description: |
        同组织资源归属校验，不返回上游成本、内部对账明细或上游任务 ID。
        实际 usage 未知时必须为 null；不可用 0 或估算值冒充实际用量。
        pending_usage 时最终金额为 null；历史扣款、退款或调整以不可覆盖的账务分录表示。
        任务软删除不抹除账单；本接口是否仍可读遵循平台账单保留策略。
      responses:
        '200':
          description: 客户账单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Billing'
        default:
          $ref: '#/components/responses/Error'
  /v1/video/generations/{task_id}/events:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: listVideoTaskEvents
      summary: 查询任务安全事件
      description: |
        只提供事件类型、状态变化、平台 request_id 和时间；
        不包含 prompt、素材 URL、H5 授权 URL、上游原文、原始上游 ID、供应商成本或内部路由。
        任务软删除不抹除安全事件。列表仅来自本组织平台数据库。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 安全事件分页
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskEvent'
                  next_cursor:
                    type: [string, 'null']
        default:
          $ref: '#/components/responses/Error'
  /v1/video/asset-groups:
    post:
      tags: [Assets]
      operationId: createVideoAssetGroup
      summary: 创建虚拟素材组
      description: |
        此接口仅创建虚拟 AIGC 组；kind 只能为 virtual。
        真人组必须通过 portrait-authorizations 官方 H5 授权完成后由平台建立，不能客户端直接创建。
      parameters:
        - $ref: '#/components/parameters/AssetIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, name]
              properties:
                kind:
                  type: string
                  const: virtual
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                description:
                  type: string
                  maxLength: 300
      responses:
        '202':
          description: 素材组已持久化受理；火山 RPC 官方信封，Action=CreateAssetGroup。
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RpcEnvelope'
                  - type: object
                    properties:
                      Result:
                        $ref: '#/components/schemas/RpcCreateAssetGroupResult'
              example:
                ResponseMetadata: {RequestId: req_example001, Action: CreateAssetGroup, Version: '2024-01-01', Service: ark, Region: cn-beijing}
                Result: {Id: ag_example001, Name: 品牌虚拟素材, Status: creating}
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [Assets]
      operationId: listVideoAssetGroups
      summary: 列出当前组织的素材组（官方 ListAssetGroups 信封）
      description: |
        仅查询本组织平台库，不透传火山账户全局列表。返回火山 RPC 官方信封，Action=ListAssetGroups；
        Result.Items 为 PascalCase 素材组条目，NextCursor 非空时继续翻页，空字符串表示末页。
      parameters:
        - $ref: '#/components/parameters/Limit'
